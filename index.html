<style>

[data-shape=sharp]{--r:4px}[data-shape=round]{--r:18px}[data-shape=bubble]{--r:34px}[data-shape=neon]{--r:12px}[data-shape=soft]{--r:24px}[data-shape=capsule]{--r:28px}
[data-shape=neon] .card{border-color:var(--a);box-shadow:0 0 16px var(--a),inset 0 0 16px color-mix(in srgb,var(--a) 20%,transparent)}
[data-shape=soft] .card{border-radius:30px 12px 30px 12px;border:1px solid color-mix(in srgb,var(--a) 55%,var(--line));box-shadow:0 10px 28px color-mix(in srgb,var(--a) 17%,transparent)}
[data-shape=soft] .btn,[data-shape=soft] .opt{border-radius:20px 8px 20px 8px;box-shadow:inset 0 1px 0 #ffffff24}
[data-shape=soft] .btn,[data-shape=soft] .opt{border-radius:18px 7px 18px 7px}

[data-shape=capsule] .btn,[data-shape=capsule] .opt,[data-shape=capsule] .chip{border-radius:999px}

[data-font=system]{--site-font:system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
[data-font=cairo]{--site-font:"Cairo",sans-serif}
[data-font=lora]{--site-font:"Lora",serif}
[data-font=mono]{--site-font:"Roboto Mono",monospace}
[data-font=montserrat]{--site-font:"Montserrat",sans-serif}
[data-font=rubik]{--site-font:"Rubik",sans-serif}
[data-mode=dark]{--bg:var(--bgd);--card:#ffffff0e;--line:#ffffff2a;--tx:#f1f5ff;--mu:#9aa8c7;--nav:#00000055}
[data-mode=light]{--bg:var(--bgl);--card:#ffffffb8;--line:#00000022;--tx:#0b1226;--mu:#566078;--nav:#ffffffb0}
[data-theme=glass][data-mode=light]{--card:transparent;--line:#ffffff66;--nav:#ffffff12}
[data-theme=glass][data-mode=dark]{--card:transparent;--line:#ffffff30;--nav:#ffffff08}
[data-theme=system] body{background:linear-gradient(135deg,#fff,#f8fafc 55%,#eef2f7);color:#111827}
[data-theme=system] .card{background:#ffffffa8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 12% 0,color-mix(in srgb,var(--a) 26%,transparent),transparent 55%),radial-gradient(circle at 92% 100%,color-mix(in srgb,var(--b) 22%,transparent),transparent 50%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:var(--site-font,system-ui,"Segoe UI",Tahoma,Arial,sans-serif)}
[data-theme=glass] body{background:radial-gradient(circle at 12% 0,color-mix(in srgb,var(--a) 28%,transparent),transparent 52%),radial-gradient(circle at 92% 100%,color-mix(in srgb,var(--b) 24%,transparent),transparent 50%),var(--bg)}
[data-theme=glass] .card{background:rgba(255,255,255,.025);border-color:color-mix(in srgb,var(--a) 25%,transparent);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 8px 32px #00000012}
[data-theme=glass] nav{background:rgba(255,255,255,.018)}
[data-theme=glass] .chip,[data-theme=glass] .opt,[data-theme=glass] input,[data-theme=glass] select{background:rgba(255,255,255,.035)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r,18px);padding:16px;backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:0 0 22px color-mix(in srgb,var(--a) 14%,transparent)}

.btn{background:linear-gradient(135deg,var(--a),var(--b));color:#06101f;border:0;border-radius:calc(var(--r,18px)*.7);padding:10px 18px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}.btn:disabled{opacity:.5}
.hidden{display:none!important}.mu{color:var(--mu)}h1,h2,h3{margin:0 0 10px}
#loader,#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 30%,#12296a,#030610);color:#e8f1ff;transition:opacity .6s}#loader.out{opacity:0;pointer-events:none}
.logo{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;letter-spacing:.18em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent;animation:pu 2s infinite alternate}@keyframes pu{to{filter:drop-shadow(0 0 22px var(--b))}}
.bar{width:min(80vw,420px);height:10px;border-radius:9px;background:#ffffff22;overflow:hidden}.bar i,.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.xp{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
#login .card{max-width:380px;width:90vw;text-align:center;background:#0b1633cc;color:#e8f1ff}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:var(--nav);border-inline-end:1px solid var(--line);backdrop-filter:blur(18px)}
nav .logo{font-size:1.15rem;margin:4px 8px 12px}
nav button{background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;text-align:start;color:var(--mu);transition:.2s}
nav button.on,nav button:hover{color:var(--tx);border-color:var(--line);background:color-mix(in srgb,var(--a) 16%,transparent)}
main{padding:18px;min-width:0;max-width:1100px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.85rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lc{text-align:start;cursor:pointer;transition:.2s;color:inherit}.lc:hover{transform:translateY(-3px);border-color:var(--a)}.big{font-size:2rem}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:11px 13px;border-radius:calc(var(--r,18px)*.65);border:1px solid var(--line);background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--a)}.opt.ok{border-color:var(--ok);background:#22c55e33}.opt.no{border-color:var(--no);background:#ef444433}.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 25%,transparent)}
input[type=search],input[type=text],input:not([type]),select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.72rem;padding:6px}.mc.up{border-color:var(--a)}.mc.ok{border-color:var(--ok);background:#22c55e33}
.mrow{margin:8px 0}.scr{letter-spacing:.2em;font-size:1.8rem;text-align:center}
.term{margin:10px 0}.term b{color:var(--a)}.tag{font-size:.8rem;color:var(--mu)}
.badge{opacity:.4;filter:grayscale(1)}.badge.got{opacity:1;filter:none;border-color:var(--a)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.sw button.on{border-color:var(--a);box-shadow:0 0 12px var(--a)}
#labFrame{width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:14px;background:#07182a}
#toast{position:fixed;top:12px;inset-inline-end:12px;z-index:99;display:flex;flex-direction:column;gap:8px}#toast div{padding:10px 16px;border-radius:12px;background:#0b1a3cf2;color:#fff;border:1px solid var(--a);animation:in .3s}@keyframes in{from{transform:translateY(-10px);opacity:0}}
.sv{width:100%;max-width:560px;display:block;margin:auto}.sv text{fill:var(--tx);font-size:11px;font-family:inherit}.fig{padding:10px}.key{margin-top:10px;padding:12px;border-radius:12px;border:1px dashed var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}.vin{animation:vin .4s ease}@keyframes vin{from{opacity:0;transform:translateY(10px)}}.opt.ok{animation:pop .3s}@keyframes pop{50%{transform:scale(1.03)}}#tl{font-size:1.2rem}
.sw2{height:48px;margin-bottom:8px;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.shop-dot{position:absolute;inset-inline-end:7px;top:7px;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px #0005}.state-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.state-notes>div{display:flex;flex-direction:column;gap:5px;padding:9px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--a) 5%,transparent);font-size:.82rem}.state-notes b{color:var(--a)}.state-notes span{color:var(--mu);line-height:1.45}@media(max-width:560px){.state-notes{grid-template-columns:1fr}}.inl{width:auto;display:inline-block;margin:0 6px}#ll{margin-bottom:10px}#ll,#login .sw{justify-content:center}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;border-inline-end:0;border-top:1px solid var(--line)}nav .logo{display:none}nav button{white-space:nowrap;font-size:.85rem;padding:8px 10px}main{padding:12px 12px 78px}#labFrame{height:calc(100vh - 200px)}.mem{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
/* Gentle image motion across the site; keeps image dimensions and layout intact. */
#app img{animation:imgArrive .65s cubic-bezier(.2,.7,.2,1) both;transition:transform .28s ease,filter .28s ease}
#app img:hover{transform:translateY(-3px) scale(1.025);filter:drop-shadow(0 7px 12px color-mix(in srgb,var(--a) 28%,transparent))}
#app .fig svg,#app svg.sv,#fullPanel .fig svg,#fullPanel svg.sv{animation:lessonFigureFloat 3.8s ease-in-out infinite;transform-origin:50% 50%}
.electron-orbit{animation:electronSpin var(--orbit-speed,6s) linear infinite;transform-box:view-box;transform-origin:var(--orbit-x) var(--orbit-y)}
@keyframes electronSpin{to{transform:rotate(360deg)}}
.solid-particle{animation:solidVibrate 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.liquid-particle{animation:liquidDrift 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gas-particle{animation:gasDrift 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes solidVibrate{0%,100%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.7px,.5px)}75%{transform:translate(.5px,.7px)}}
@keyframes liquidDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx,3px),var(--dy,-3px))}}
@keyframes gasDrift{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--dx,7px),var(--dy,-6px))}50%{transform:translate(calc(var(--dx,7px)*-.7),calc(var(--dy,-6px)*-.8))}75%{transform:translate(calc(var(--dx,7px)*.35),calc(var(--dy,-6px)*-1))}}
#app .fig img,#app .lesson img,#fullPanel .fig img{animation:lessonImageFloat 4.2s ease-in-out infinite}
@keyframes imgArrive{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lessonFigureFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lessonImageFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(.35deg)}}
[data-anim=off] #app img,[data-anim=off] #app .fig svg,[data-anim=off] #app svg.sv,[data-anim=off] #fullPanel img,[data-anim=off] #fullPanel svg,[data-anim=off] .electron-orbit,[data-anim=off] .solid-particle,[data-anim=off] .liquid-particle,[data-anim=off] .gas-particle{animation:none!important;transition:none!important;transform:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.adm{display:grid;gap:14px}.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.adm-stats b{display:block;font-size:1.35rem;color:var(--a)}
.adm-bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.adm-bar>*{flex:1 1 130px;margin:0}
.adm input[type=number],.adm-modal input[type=number]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.adm-row{display:grid;grid-template-columns:38px 1fr auto;gap:4px 8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.adm-row .s{grid-column:2/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem}
@media(min-width:761px){.adm-row{grid-template-columns:44px 1.2fr 2fr auto}.adm-row .s{grid-column:auto}}
.adm-modal{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}.adm-modal>.card{max-width:560px;width:100%;background:var(--bg);margin:auto}
.adm-ach{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.adm-ach .btn{flex:0 0 auto;padding:6px 12px}

/* Steven Emad signature footer */
#signatureFooter{margin:34px auto 12px;padding:22px 12px 8px;border-top:1px solid var(--line);text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:7px}
#signatureFooter .credit{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.8}
#signatureFooter img{display:block;width:min(230px,62vw);height:auto;max-height:76px;object-fit:contain;opacity:.94;filter:drop-shadow(0 2px 5px #0002)}
[data-mode=dark] #signatureFooter img{filter:invert(1) drop-shadow(0 2px 5px #fff2)}
#signatureFooter .site-credit{font-size:.7rem;opacity:.65}
@media(max-width:760px){#signatureFooter{margin:24px auto 4px;padding:18px 8px 6px}#signatureFooter img{width:min(190px,58vw);max-height:64px}}

1:["Metal|Métal|الفلز§An element that is shiny and conducts heat and electricity well.|Élément brillant qui conduit bien la chaleur et l'électricité.|عنصر لامع يوصل الحرارة والكهرباء جيدًا.","Non-metal|Non-métal|اللافلز§An element that usually does not conduct heat or electricity well.|Élément qui conduit généralement mal la chaleur et l'électricité.|عنصر لا يوصل عادةً الحرارة والكهرباء جيدًا.","Metalloid|Métalloïde|شبه الفلز§An element with properties between metals and non-metals, such as silicon.|Élément aux propriétés intermédiaires entre métaux et non-métaux, comme le silicium.|عنصر خواصه بين الفلزات واللافلزات مثل السيليكون.","Alkali metals|Métaux alcalins|الفلزات القلوية§The reactive metals of Group 1, such as lithium, sodium and potassium.|Métaux réactifs du groupe 1, comme le lithium, le sodium et le potassium.|فلزات نشطة في المجموعة 1 مثل الليثيوم والصوديوم والبوتاسيوم.","Halogens|Halogènes|الهالوجينات§The reactive non-metals of Group 17, such as fluorine and chlorine.|Non-métaux réactifs du groupe 17, comme le fluor et le chlore.|لافلزات نشطة في المجموعة 17 مثل الفلور والكلور."],
2:["Solid|Solide|الحالة الصلبة§A state of matter with a fixed shape and a fixed volume.|État de la matière à forme et volume fixes.|حالة للمادة لها شكل وحجم ثابتان.","Liquid|Liquide|الحالة السائلة§A state of matter with a fixed volume that takes the shape of its container.|État de la matière à volume fixe qui prend la forme de son récipient.|حالة للمادة لها حجم ثابت وتأخذ شكل الإناء.","Gas|Gaz|الحالة الغازية§A state of matter with no fixed shape or volume.|État de la matière sans forme ni volume fixes.|حالة للمادة ليس لها شكل أو حجم ثابت.","Melting point|Point de fusion|درجة الانصهار§The temperature at which a solid changes into a liquid.|Température à laquelle un solide devient liquide.|درجة الحرارة التي يتحول عندها الجسم الصلب إلى سائل.","Boiling point|Point d'ébullition|درجة الغليان§The temperature at which a liquid changes into a gas.|Température à laquelle un liquide devient gaz.|درجة الحرارة التي يتحول عندها السائل إلى غاز.","Volume|Volume|الحجم§The space that a substance occupies.|L'espace occupé par une substance.|الحيز الذي تشغله المادة.","Pure substance|Substance pure|المادة النقية§A substance made of only one kind of particle.|Substance formée d'un seul type de particules.|مادة تتكون من نوع واحد فقط من الجسيمات."],
3:["Ion|Ion|الأيون§An atom that has gained or lost electrons, so it is charged.|Atome qui a gagné ou perdu des électrons et qui est donc chargé.|ذرة اكتسبت إلكترونات أو فقدتها فأصبحت مشحونة.","Molecule|Molécule|الجزيء§A group of atoms joined by covalent bonds.|Groupe d'atomes liés par des liaisons covalentes.|مجموعة من الذرات ترتبط بروابط تساهمية.","Compound|Composé|المركب§A substance made of two or more different elements chemically joined.|Substance formée de deux éléments différents ou plus unis chimiquement.|مادة تتكون من اتحاد عنصرين مختلفين أو أكثر كيميائيًا.","Chemical formula|Formule chimique|الصيغة الكيميائية§Symbols and numbers showing the atoms in a substance, such as H₂O.|Symboles et nombres indiquant les atomes d'une substance, comme H₂O.|رموز وأرقام توضح الذرات في المادة مثل H₂O."],
4:["Conductor|Conducteur|الموصل§A material that lets electric charge move through it easily, such as copper.|Matériau qui laisse facilement circuler les charges, comme le cuivre.|مادة تسمح بمرور الشحنات الكهربية بسهولة مثل النحاس.","Insulator|Isolant|العازل§A material that does not let electric charge move easily, such as plastic.|Matériau qui laisse mal circuler les charges, comme le plastique.|مادة لا تسمح بمرور الشحنات بسهولة مثل البلاستيك.","Charging by friction|Électrisation par frottement|الشحن بالدلك§Charging objects by rubbing them together so that electrons transfer.|Charger des objets en les frottant, ce qui transfère des électrons.|شحن الأجسام بدلكها معًا فتنتقل الإلكترونات بينها."],
5:["Compass|Boussole|البوصلة§A tool with a small magnetic needle that points north.|Instrument à aiguille aimantée qui indique le nord.|أداة بها إبرة مغناطيسية صغيرة تشير إلى الشمال.","Magnetic material|Matériau magnétique|المادة المغناطيسية§A material attracted by a magnet, such as iron, nickel and cobalt.|Matériau attiré par un aimant, comme le fer, le nickel et le cobalt.|مادة تنجذب إلى المغناطيس مثل الحديد والنيكل والكوبالت."],
6:["Newton|Newton|النيوتن§The unit used to measure force and weight.|Unité de mesure d'une force et du poids.|وحدة قياس القوة والوزن.","Kilogram|Kilogramme|الكيلوجرام§The unit used to measure mass.|Unité de mesure de la masse.|وحدة قياس الكتلة.","Force|Force|القوة§A push or a pull that can change the shape, speed or direction of an object.|Poussée ou traction pouvant changer la forme, la vitesse ou la direction d'un objet.|دفع أو سحب يغير شكل الجسم أو سرعته أو اتجاهه."],
7:["Cytoplasm|Cytoplasme|السيتوبلازم§The jelly-like material inside the cell where many reactions take place.|Substance gélatineuse de la cellule où ont lieu de nombreuses réactions.|المادة الهلامية داخل الخلية وتحدث فيها تفاعلات كثيرة.","Cell wall|Paroi cellulaire|الجدار الخلوي§A rigid layer outside the cell membrane of plant cells that supports the cell.|Couche rigide autour de la membrane des cellules végétales qui les soutient.|طبقة صلبة خارج الغشاء الخلوي في الخلية النباتية تدعمها.","Photosynthesis|Photosynthèse|البناء الضوئي§The process by which plants use light to make food from carbon dioxide and water.|Processus par lequel les plantes fabriquent leur nourriture avec la lumière, le dioxyde de carbone et l'eau.|عملية تصنع بها النباتات غذاءها باستخدام الضوء وثاني أكسيد الكربون والماء.","Microscope|Microscope|المجهر§An instrument that magnifies very small objects such as cells.|Instrument qui grossit de très petits objets comme les cellules.|أداة تكبّر الأجسام الدقيقة جدًا مثل الخلايا.","Unicellular|Unicellulaire|وحيد الخلية§An organism made of a single cell.|Être vivant formé d'une seule cellule.|كائن حي يتكون من خلية واحدة.","Multicellular|Pluricellulaire|عديد الخلايا§An organism made of many cells.|Être vivant formé de plusieurs cellules.|كائن حي يتكون من عدد كبير من الخلايا."],
8:["Nutrition|Nutrition|التغذية§Taking in the food an organism needs.|Fait de prendre les aliments dont l'organisme a besoin.|حصول الكائن الحي على الغذاء الذي يحتاجه.","Excretion|Excrétion|الإخراج§Getting rid of waste products from the body.|Élimination des déchets de l'organisme.|التخلص من الفضلات الناتجة عن العمليات الحيوية.","Stimulus|Stimulus|المؤثر§A change in the environment that an organism responds to.|Changement de l'environnement auquel un être vivant réagit.|تغير في البيئة يستجيب له الكائن الحي."],
9:["Fungi|Champignons|الفطريات§Organisms such as yeast and mould; some cause disease and some are useful.|Organismes comme la levure et les moisissures ; certains causent des maladies, d'autres sont utiles.|كائنات مثل الخميرة والعفن، بعضها يسبب أمراضًا وبعضها نافع.","Disease|Maladie|المرض§A condition that stops the body working normally; some are caused by microbes.|État qui empêche l'organisme de fonctionner normalement ; certaines sont causées par des microbes.|حالة تمنع الجسم من العمل بصورة طبيعية، وبعضها تسببه الميكروبات.","Vaccine|Vaccin|اللقاح§A preparation that helps the body build protection against a disease.|Préparation qui aide l'organisme à se protéger contre une maladie.|مستحضر يساعد الجسم على بناء مناعة ضد مرض.","Yeast|Levure|الخميرة§A single-celled fungus used to make bread.|Champignon unicellulaire utilisé pour faire le pain.|فطر وحيد الخلية يستخدم في صناعة الخبز."],
10:["Sun|Soleil|الشمس§The star at the centre of the solar system.|L'étoile au centre du système solaire.|النجم الذي يقع في مركز النظام الشمسي.","Earth|Terre|الأرض§The third planet from the Sun, the planet we live on.|Troisième planète à partir du Soleil, celle où nous vivons.|الكوكب الثالث بعدًا عن الشمس والكوكب الذي نعيش عليه.","Moon|Lune|القمر§A natural satellite that orbits the Earth.|Satellite naturel qui tourne autour de la Terre.|جرم طبيعي (تابع) يدور حول الأرض.","Star|Étoile|النجم§A huge ball of hot gas that makes its own light and heat, like the Sun.|Énorme boule de gaz chaud qui produit sa propre lumière et chaleur, comme le Soleil.|كرة ضخمة من الغازات الساخنة تنتج الضوء والحرارة بنفسها مثل الشمس.","Orbit|Orbite|المدار§The path of a body moving around another body.|Trajectoire d'un corps autour d'un autre.|المسار الذي يتحرك فيه جرم حول جرم آخر.","Axis|Axe|محور الأرض§The imaginary line through the Earth from the North Pole to the South Pole.|Ligne imaginaire traversant la Terre du pôle Nord au pôle Sud.|خط وهمي يمر بالأرض من القطب الشمالي إلى القطب الجنوبي.","Asteroid|Astéroïde|الكويكب§A small rocky body that orbits the Sun, mostly between Mars and Jupiter.|Petit corps rocheux qui tourne autour du Soleil, surtout entre Mars et Jupiter.|جرم صخري صغير يدور حول الشمس، معظمه بين المريخ والمشتري.","Comet|Comète|المذنب§A body of ice and dust that orbits the Sun and grows a tail near it.|Corps de glace et de poussière qui tourne autour du Soleil et développe une queue près de lui.|جرم من الجليد والغبار يدور حول الشمس ويظهر له ذيل عند اقترابه منها."],
11:["Moon phases|Phases de la Lune|أطوار القمر§The different shapes of the Moon that we see as it orbits the Earth.|Formes différentes de la Lune vues au cours de sa révolution autour de la Terre.|الأشكال المختلفة للقمر كما نراها أثناء دورانه حول الأرض.","Total lunar eclipse|Éclipse lunaire totale|الخسوف الكلي§When the whole Moon enters the darkest part of the Earth's shadow.|Quand toute la Lune entre dans la partie la plus sombre de l'ombre de la Terre.|عندما يدخل القمر كله في أظلم جزء من ظل الأرض.","Partial lunar eclipse|Éclipse lunaire partielle|الخسوف الجزئي§When only part of the Moon enters the Earth's shadow.|Quand une partie seulement de la Lune entre dans l'ombre de la Terre.|عندما يدخل جزء فقط من القمر في ظل الأرض."]};

const TX=[
["Everything around us is made of tiny particles called atoms. In the centre of the atom is the nucleus, which contains protons and neutrons, while electrons move around it in energy levels.|Tout ce qui nous entoure est formé de minuscules particules appelées atomes. Au centre de l'atome se trouve le noyau, qui contient des protons et des neutrons, tandis que les électrons se déplacent autour dans des niveaux d'énergie.|كل ما حولنا يتكون من جسيمات صغيرة جدًا تسمى الذرات. في مركز الذرة توجد النواة وتحتوي على البروتونات والنيوترونات، بينما تتحرك الإلكترونات حولها في مستويات الطاقة.","Protons are positive, electrons are negative and neutrons have no charge. In a neutral atom the number of protons equals the number of electrons, so the charges cancel out.|Les protons sont positifs, les électrons négatifs et les neutrons n'ont pas de charge. Dans un atome neutre, le nombre de protons est égal au nombre d'électrons : les charges s'annulent.|البروتونات موجبة والإلكترونات سالبة والنيوترونات متعادلة. وفي الذرة المتعادلة يتساوى عدد البروتونات مع عدد الإلكترونات فتتعادل الشحنات.","Atomic number = number of protons. Mass number = protons + neutrons.|Numéro atomique = nombre de protons. Nombre de masse = protons + neutrons.|العدد الذري = عدد البروتونات. العدد الكتلي = عدد البروتونات + عدد النيوترونات."],
["The periodic table arranges the elements in order of increasing atomic number. It contains 118 elements.|Le tableau périodique classe les éléments par numéro atomique croissant. Il contient 118 éléments.|يرتب الجدول الدوري العناصر تصاعديًا حسب العدد الذري، ويحتوي على 118 عنصرًا.","The horizontal rows are called periods and the vertical columns are called groups. Elements in the same group have similar properties because they have the same number of electrons in their outer energy level.|Les lignes horizontales sont les périodes et les colonnes verticales sont les groupes. Les éléments d'un même groupe ont des propriétés semblables car ils ont le même nombre d'électrons sur leur dernier niveau d'énergie.|الصفوف الأفقية تسمى دورات والأعمدة الرأسية تسمى مجموعات. عناصر المجموعة الواحدة متشابهة في خواصها لأن لها نفس عدد الإلكترونات في مستوى الطاقة الأخير.","Elements are classified as metals, non-metals and metalloids. Group 18 contains the unreactive noble gases.|Les éléments se classent en métaux, non-métaux et métalloïdes. Le groupe 18 contient les gaz nobles, très peu réactifs.|تُصنَّف العناصر إلى فلزات ولافلزات وأشباه فلزات. وتضم المجموعة 18 الغازات النبيلة قليلة النشاط."],
["Matter is anything that has mass and occupies space. It exists in three common states: solid, liquid and gas.|La matière est tout ce qui a une masse et occupe un volume. Elle existe sous trois états courants : solide, liquide et gaz.|المادة هي كل ما له كتلة ويشغل حيزًا من الفراغ، وتوجد في ثلاث حالات شائعة: صلبة وسائلة وغازية.","In a solid the particles are tightly packed, so it has a fixed shape and volume. A liquid has a fixed volume but takes the shape of its container. A gas has no fixed shape or volume and fills its container.|Dans un solide, les particules sont serrées : forme et volume fixes. Un liquide a un volume fixe mais prend la forme de son récipient. Un gaz n'a ni forme ni volume fixes et remplit son récipient.|في المادة الصلبة تكون الجسيمات متراصة فلها شكل وحجم ثابتان. السائل له حجم ثابت ويأخذ شكل الإناء. أما الغاز فليس له شكل أو حجم ثابت ويملأ الإناء الذي يوضع فيه.","Density = mass ÷ volume. Melting point and boiling point also help us identify substances.|Masse volumique = masse ÷ volume. Les points de fusion et d'ébullition aident aussi à identifier les substances.|الكثافة = الكتلة ÷ الحجم. وتساعدنا درجتا الانصهار والغليان أيضًا في التعرف على المواد."],
["Atoms form chemical bonds to reach a stable arrangement of electrons in their outer energy level, like the noble gases.|Les atomes forment des liaisons chimiques pour atteindre une disposition stable des électrons sur leur dernier niveau d'énergie, comme les gaz nobles.|ترتبط الذرات بروابط كيميائية لتصل إلى ترتيب مستقر للإلكترونات في مستوى الطاقة الأخير، مثل الغازات النبيلة.","In an ionic bond, one atom transfers electrons to another (usually a metal to a non-metal). The oppositely charged ions attract each other, as in sodium chloride (NaCl).|Dans une liaison ionique, un atome cède des électrons à un autre (souvent un métal à un non-métal). Les ions de charges opposées s'attirent, comme dans le chlorure de sodium (NaCl).|في الرابطة الأيونية تنتقل إلكترونات من ذرة إلى أخرى (غالبًا من فلز إلى لافلز)، فتتجاذب الأيونات المختلفة الشحنة كما في كلوريد الصوديوم NaCl.","In a covalent bond, atoms (usually non-metals) share electrons and form molecules, such as water (H₂O).|Dans une liaison covalente, les atomes (souvent des non-métaux) partagent des électrons et forment des molécules, comme l'eau (H₂O).|في الرابطة التساهمية تتشارك الذرات (غالبًا اللافلزات) في الإلكترونات وتكوّن جزيئات مثل الماء H₂O."],
["An object becomes charged when it gains or loses electrons. Gaining electrons makes it negative; losing electrons makes it positive.|Un objet devient chargé lorsqu'il gagne ou perd des électrons. S'il en gagne, il est négatif ; s'il en perd, il est positif.|يصبح الجسم مشحونًا عندما يكتسب إلكترونات أو يفقدها. اكتساب الإلكترونات يجعله سالب الشحنة، وفقدانها يجعله موجب الشحنة.","Like charges repel and unlike charges attract. The force is stronger when the charges are larger and the distance between them is smaller.|Les charges de même signe se repoussent et celles de signes contraires s'attirent. La force est plus grande quand les charges sont grandes et la distance petite.|الشحنات المتشابهة تتنافر والمختلفة تتجاذب. وتزداد القوة بزيادة الشحنتين وبنقصان المسافة بينهما.","Rubbing a balloon on your hair transfers electrons and produces static electricity. Lightning is a large natural example.|Frotter un ballon sur les cheveux transfère des électrons et produit de l'électricité statique. La foudre en est un grand exemple naturel.|دلك البالون بالشعر ينقل الإلكترونات وينتج كهربية ساكنة. والبرق مثال طبيعي كبير على ذلك."],
["A magnet attracts objects made of iron, nickel and cobalt. Every magnet has two poles, north and south, where its force is strongest.|Un aimant attire les objets en fer, nickel et cobalt. Tout aimant a deux pôles, nord et sud, où sa force est la plus grande.|يجذب المغناطيس الأجسام المصنوعة من الحديد والنيكل والكوبالت. ولكل مغناطيس قطبان شمالي وجنوبي تكون القوة عندهما أكبر ما يمكن.","Like poles repel and unlike poles attract. If you cut a magnet in half, each piece still has a north and a south pole.|Les pôles identiques se repoussent et les pôles opposés s'attirent. Si l'on coupe un aimant en deux, chaque morceau a toujours un pôle nord et un pôle sud.|الأقطاب المتشابهة تتنافر والمختلفة تتجاذب. وإذا قُطع المغناطيس إلى نصفين يصبح لكل جزء قطبان شمالي وجنوبي.","The magnetic field is the region around a magnet where its force acts. The Earth behaves like a giant magnet, which is why a compass points north.|Le champ magnétique est la région autour d'un aimant où s'exerce sa force. La Terre se comporte comme un énorme aimant, c'est pourquoi la boussole indique le nord.|المجال المغناطيسي هو المنطقة المحيطة بالمغناطيس التي تظهر فيها قوته. والأرض تتصرف كمغناطيس ضخم، ولذلك تشير البوصلة إلى الشمال."],
["Gravity is the force of attraction between any two objects that have mass. The larger the masses and the closer the objects, the stronger the force.|La gravité est la force d'attraction entre deux objets quelconques ayant une masse. Plus les masses sont grandes et plus les objets sont proches, plus la force est grande.|الجاذبية قوة تجاذب بين أي جسمين لهما كتلة، وتزداد كلما زادت الكتلتان وقلّت المسافة بينهما.","The Earth's gravity pulls objects towards its centre, so things fall. Gravity also keeps the Moon orbiting the Earth and the planets orbiting the Sun.|La gravité terrestre attire les objets vers son centre : c'est pourquoi les objets tombent. Elle maintient aussi la Lune en orbite autour de la Terre et les planètes autour du Soleil.|تجذب جاذبية الأرض الأجسام نحو مركزها فتسقط. كما تُبقي الجاذبية القمر في مداره حول الأرض والكواكب في مداراتها حول الشمس.","Mass (kg) stays the same everywhere, but weight (N) depends on gravity. On the Moon gravity is about one sixth of Earth's, so objects weigh less there.|La masse (kg) est la même partout, mais le poids (N) dépend de la gravité. Sur la Lune, la gravité vaut environ un sixième de celle de la Terre : les objets y pèsent moins.|الكتلة (كجم) ثابتة في كل مكان، أما الوزن (نيوتن) فيعتمد على الجاذبية. وجاذبية القمر نحو سدس جاذبية الأرض، فيقل وزن الأجسام عليه."],
["The cell is the basic unit of structure and function in all living organisms. Some organisms have only one cell, while others, like humans, have trillions.|La cellule est l'unité de base de la structure et du fonctionnement de tous les êtres vivants. Certains n'ont qu'une cellule, d'autres, comme l'être humain, en ont des milliers de milliards.|الخلية هي وحدة البناء والوظيفة في جميع الكائنات الحية. بعض الكائنات وحيدة الخلية وبعضها، مثل الإنسان، يتكون من تريليونات الخلايا.","The cell membrane controls what enters and leaves, the nucleus controls the cell's activities, and the cytoplasm is the jelly-like material where many reactions take place.|La membrane contrôle ce qui entre et sort, le noyau dirige les activités de la cellule, et le cytoplasme est la substance gélatineuse où ont lieu de nombreuses réactions.|الغشاء الخلوي ينظم دخول المواد وخروجها، والنواة تتحكم في أنشطة الخلية، والسيتوبلازم مادة هلامية تحدث فيها تفاعلات كثيرة.","Plant cells also have a cell wall and chloroplasts (where photosynthesis happens); animal cells do not.|Les cellules végétales ont aussi une paroi et des chloroplastes (où a lieu la photosynthèse) ; pas les cellules animales.|تتميز الخلية النباتية بوجود جدار خلوي وبلاستيدات خضراء (يتم فيها البناء الضوئي)، ولا توجد في الخلية الحيوانية."],
["All living organisms carry out life processes: nutrition, respiration, growth, response to stimuli, reproduction and excretion.|Tous les êtres vivants réalisent des processus vitaux : nutrition, respiration, croissance, réaction aux stimuli, reproduction et excrétion.|تقوم جميع الكائنات الحية بعمليات حيوية هي: التغذية والتنفس والنمو والاستجابة للمؤثرات والتكاثر والإخراج.","Respiration releases energy from food, growth increases the size and number of cells, and reproduction produces new individuals of the same kind.|La respiration libère l'énergie des aliments, la croissance augmente la taille et le nombre de cellules, et la reproduction produit de nouveaux individus de la même espèce.|التنفس يحرر الطاقة من الغذاء، والنمو يزيد حجم الكائن وعدد خلاياه، والتكاثر ينتج أفرادًا جديدة من النوع نفسه.","Non-living things, such as rocks and water, do not carry out all of these processes.|Les objets non vivants, comme les roches et l'eau, ne réalisent pas tous ces processus.|الأشياء غير الحية، مثل الصخور والماء، لا تقوم بكل هذه العمليات."],
["Microbes are tiny organisms that can only be seen with a microscope. The main types include bacteria, viruses and fungi.|Les microbes sont de minuscules organismes visibles seulement au microscope. Les principaux types sont les bactéries, les virus et les champignons.|الميكروبات كائنات دقيقة لا تُرى إلا بالمجهر، ومن أنواعها الرئيسية البكتيريا والفيروسات والفطريات.","Some microbes are harmful and cause diseases, such as cholera and the flu. Others are useful: yeast is used to make bread, and some bacteria are used to make yoghurt.|Certains microbes sont nuisibles et causent des maladies, comme le choléra et la grippe. D'autres sont utiles : la levure sert à faire le pain et certaines bactéries à faire le yaourt.|بعض الميكروبات ضار ويسبب أمراضًا مثل الكوليرا والإنفلونزا، وبعضها نافع؛ فالخميرة تُستخدم في صناعة الخبز وبعض البكتيريا في صناعة الزبادي.","Washing hands, cooking food well, storing food in the fridge and vaccination help prevent diseases caused by microbes.|Se laver les mains, bien cuire les aliments, les conserver au réfrigérateur et se faire vacciner aident à prévenir les maladies causées par les microbes.|غسل اليدين وطهي الطعام جيدًا وحفظه في الثلاجة والتطعيم تساعد على الوقاية من الأمراض التي تسببها الميكروبات."],
["The solar system consists of the Sun, the eight planets and their moons, asteroids and comets, all orbiting the Sun. The Sun is a star and our main source of light and heat.|Le système solaire comprend le Soleil, les huit planètes et leurs lunes, des astéroïdes et des comètes, qui tournent tous autour du Soleil. Le Soleil est une étoile, notre principale source de lumière et de chaleur.|يتكون النظام الشمسي من الشمس والكواكب الثمانية وأقمارها والكويكبات والمذنبات التي تدور جميعها حول الشمس. والشمس نجم وهي مصدرنا الرئيسي للضوء والحرارة.","From the Sun outwards: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.|En partant du Soleil : Mercure, Vénus, la Terre, Mars, Jupiter, Saturne, Uranus et Neptune.|بالترتيب من الشمس: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون.","The Earth rotates on its axis once every 24 hours (day and night) and revolves around the Sun once a year (about 365 days).|La Terre tourne sur son axe en 24 heures (jour et nuit) et fait le tour du Soleil en un an (environ 365 jours).|تدور الأرض حول محورها مرة كل 24 ساعة (الليل والنهار) وحول الشمس مرة كل سنة (نحو 365 يومًا)."],
["A lunar eclipse happens when the Earth is between the Sun and the Moon, in a straight line, so the Earth's shadow falls on the Moon.|Une éclipse lunaire se produit quand la Terre se place entre le Soleil et la Lune, en ligne droite : l'ombre de la Terre tombe sur la Lune.|يحدث خسوف القمر عندما تقع الأرض بين الشمس والقمر على استقامة واحدة، فيسقط ظل الأرض على القمر.","It can only happen at full moon. It does not happen every month because the Moon's orbit is slightly tilted, so the three bodies are usually not perfectly aligned.|Elle ne peut avoir lieu qu'à la pleine lune. Elle n'a pas lieu chaque mois car l'orbite de la Lune est légèrement inclinée : les trois astres ne sont généralement pas parfaitement alignés.|لا يحدث الخسوف إلا في طور البدر، ولا يحدث كل شهر لأن مدار القمر مائل قليلًا فلا تكون الأجرام الثلاثة على استقامة واحدة تمامًا في الغالب.","In a total lunar eclipse the Moon often looks reddish. Unlike a solar eclipse, a lunar eclipse is safe to watch with the naked eye.|Lors d'une éclipse lunaire totale, la Lune paraît souvent rougeâtre. Contrairement à l'éclipse solaire, on peut l'observer sans danger à l'œil nu.|في الخسوف الكلي يبدو القمر غالبًا محمرًّا. وعلى عكس كسوف الشمس، يمكن مشاهدة خسوف القمر بالعين المجردة بأمان."]];

function mkQ(kind,p,all){const o=sh(all.filter(x=>x.id!==p.id));const exp=`<b>${p.t}</b>: ${p.d}`;

if(kind==="f")return{k:"f",q:tr("fillq")+`<br><i>${p.d}</i>`,a:p.t,exp};
const ps=[p,...o.slice(0,3)];return{k:"m",q:tr("matchq"),ps,exp:ps.map(x=>`<b>${x.t}</b>: ${x.d}`).join("<br>")}}

const ao=$("#ao"),fin=(ok)=>{if(ans)return;ans=true;clearInterval(tm);if(ok){sc++;SFX.ok();daily()}else SFX.no();log.push({q:q.q,ok,exp:q.exp});
$("#fb").innerHTML=`<b style="color:var(--${ok?"ok":"no"})">${tr(ok?"correct":"wrong")}</b> — ${q.exp}`;const b=document.createElement("button");b.className="btn";b.textContent=tr("next");b.onclick=()=>{i++;nx()};$("#fb").after(b);hdr()};

"Energy levels|Niveaux d'énergie|مستويات الطاقة§Electrons move in up to 7 main levels (n = 1–7, letters K, L, M, N…); energy grows with distance from the nucleus. A level holds up to 2n² electrons (2, 8, 18, 32); the outer level holds at most 8. Extra electrons go to the next level.|Les électrons occupent jusqu'à 7 niveaux (n = 1–7, lettres K, L, M, N…) ; l'énergie augmente avec la distance. Un niveau contient au plus 2n² électrons (2, 8, 18, 32) ; le dernier au plus 8.|تدور الإلكترونات في 7 مستويات رئيسية (n = 1 إلى 7 ويرمز لها K, L, M, N…) وتزداد طاقتها بالبعد عن النواة. يتشبع المستوى بـ 2n² إلكترون (2، 8، 18، 32) والمستوى الخارجي لا يزيد عن 8، وما زاد ينتقل للمستوى التالي.",
"Atomic and mass numbers|Numéros atomique et de masse|العدد الذري والعدد الكتلي§Atomic number Z = number of protons = number of electrons in a neutral atom (bottom-left of the symbol). Mass number A = protons + neutrons = nucleons (top-left). Neutrons = A − Z.|Numéro atomique Z = protons = électrons (atome neutre), en bas à gauche. Nombre de masse A = protons + neutrons (nucléons), en haut à gauche. Neutrons = A − Z.|العدد الذري Z = عدد البروتونات = عدد الإلكترونات في الذرة المتعادلة (أسفل يسار الرمز). العدد الكتلي A = البروتونات + النيوترونات = عدد النيوكلونات (أعلى يسار الرمز). عدد النيوترونات = A − Z.",
"Isotopes|Isotopes|النظائر§Atoms of one element with the same Z but different A (different neutrons). Hydrogen has three: protium (no neutron), deuterium, tritium.|Atomes d'un même élément ayant le même Z mais un A différent. L'hydrogène en a trois : protium (sans neutron), deutérium, tritium.|ذرات العنصر الواحد التي تتفق في العدد الذري وتختلف في العدد الكتلي لاختلاف عدد النيوترونات. للهيدروجين ثلاثة نظائر: بروتيوم (بلا نيوترونات) وديوتيريوم وتريتيوم.",
"Symbols and NPK fertiliser|Symboles et engrais NPK|الرموز وسماد NPK§A symbol is one capital letter or a capital plus a small letter (C, Na). If the English and Latin names differ, the Latin name is used: Na, K, Cu, Fe. NPK: nitrogen greens leaves, phosphorus strengthens roots, potassium helps healthy growth; overuse harms the environment.|Un symbole = une majuscule ou majuscule + minuscule (C, Na) ; si les noms anglais et latin diffèrent, on utilise le latin : Na, K, Cu, Fe. NPK : N verdit les feuilles, P renforce les racines, K aide la croissance ; l'excès nuit à l'environnement.|رمز العنصر حرف كبير أو حرف كبير يليه صغير (C, Na)، وإذا اختلف الاسم الإنجليزي عن اللاتيني يؤخذ الرمز من اللاتيني: Na وK وCu وFe. سماد NPK: النيتروجين لاخضرار الأوراق والفوسفور لتقوية الجذور والبوتاسيوم للنمو الصحي، والإفراط في الأسمدة يضر بالبيئة."],
["Mendeleev and the modern table|Mendeleïev et le tableau moderne|مندليف والجدول الحديث§Mendeleev ordered elements by atomic mass and left gaps for undiscovered ones. The modern table orders the 118 elements by increasing atomic number.|Mendeleïev classait par masse atomique et laissait des cases vides. Le tableau moderne classe les 118 éléments par numéro atomique croissant.|رتّب مندليف العناصر حسب كتلتها الذرية وترك فراغات لعناصر لم تُكتشف بعد. ويرتب الجدول الحديث العناصر الـ118 تصاعديًا حسب العدد الذري.",
"Periods|Périodes|الدورات§7 horizontal rows. Elements of a period have the same number of energy levels, equal to the period number.|7 lignes horizontales. Les éléments d'une période ont le même nombre de niveaux d'énergie, égal au numéro de la période.|7 صفوف أفقية. عناصر الدورة الواحدة لها نفس عدد مستويات الطاقة ويساوي رقم الدورة.",
"Groups|Groupes|المجموعات§18 vertical columns. Elements of a group have the same number of outer electrons, so their chemical properties are similar. Position therefore shows the atomic structure and the reactivity.|18 colonnes verticales. Les éléments d'un groupe ont le même nombre d'électrons externes, donc des propriétés chimiques semblables. La position renseigne sur la structure et la réactivité.|18 عمودًا رأسيًا. عناصر المجموعة الواحدة لها نفس عدد إلكترونات المستوى الخارجي فتتشابه في خواصها الكيميائية. فموقع العنصر يدل على تركيبه الذري ونشاطه الكيميائي.",
"Metals, non-metals, metalloids|Métaux, non-métaux, métalloïdes|الفلزات واللافلزات وأشباه الفلزات§Metals (left side) are shiny and conduct heat and electricity. Non-metals (right side) conduct poorly. Metalloids lie along the stair-step line between them.|Métaux (à gauche) : brillants, bons conducteurs. Non-métaux (à droite) : mauvais conducteurs. Métalloïdes : le long de la ligne en escalier entre les deux.|الفلزات (يسار الجدول) لامعة وتوصل الحرارة والكهرباء. اللافلزات (يمين الجدول) رديئة التوصيل. وأشباه الفلزات تقع على خط الفصل المتدرج بينهما.",
"Noble gases|Gaz nobles|الغازات النبيلة§Group 18 has a full outer level (8 electrons, helium 2), so these gases are stable and almost unreactive.|Le groupe 18 a un niveau externe complet (8 électrons, hélium 2) : gaz stables, presque inertes.|المجموعة 18 مستواها الخارجي مكتمل (8 إلكترونات، والهيليوم 2) فهي مستقرة وقليلة النشاط جدًا."],
["Matter and substances|Matière et substances|المادة والمواد§Matter has mass and takes up space. A pure substance has one kind of atom or molecule; a mixture has two or more substances.|La matière a une masse et un volume. Une substance pure contient un seul type d'atomes ou de molécules ; un mélange en contient plusieurs.|المادة لها كتلة وتشغل حيزًا. المادة النقية تتكون من نوع واحد من الذرات أو الجزيئات، والخليط من مادتين أو أكثر.",
"States of matter|États de la matière|حالات المادة§Solid: tightly packed, fixed shape and volume. Liquid: fixed volume, takes the container's shape. Gas: no fixed shape or volume.|Solide : particules serrées, forme et volume fixes. Liquide : volume fixe, forme du récipient. Gaz : ni forme ni volume fixes.|الصلب: جسيمات متراصة وله شكل وحجم ثابتان. السائل: حجمه ثابت ويأخذ شكل الإناء. الغاز: لا شكل ولا حجم ثابتين.",
"Physical and chemical properties|Propriétés physiques et chimiques|الخواص الفيزيائية والكيميائية§Physical: density (mass ÷ volume), melting point, boiling point, colour, solubility. Chemical: how a substance reacts, such as burning or rusting. Each pure substance has its own set, used to identify it.|Physiques : masse volumique (masse ÷ volume), fusion, ébullition, couleur, solubilité. Chimiques : façon de réagir (combustion, rouille). Chaque substance pure a les siennes, ce qui permet de l'identifier.|الفيزيائية: الكثافة (الكتلة ÷ الحجم) ودرجتا الانصهار والغليان واللون والذوبان. الكيميائية: طريقة تفاعل المادة كالاحتراق والصدأ. لكل مادة نقية خواصها التي تُستخدم في التعرف عليها.",
"Molecules|Molécules|الجزيئات§Molecules are atoms joined together, from 2 atoms (O₂) to thousands. Substances differ by the kinds of atoms they contain and how these are joined; e.g. water H₂O and carbon dioxide CO₂.|Les molécules sont des atomes liés, de 2 (O₂) à des milliers. Les substances diffèrent par les types d'atomes et leur liaison ; ex. eau H₂O, dioxyde de carbone CO₂.|الجزيئات ذرات مرتبطة معًا، من ذرتين (O₂) إلى آلاف الذرات. تختلف المواد باختلاف أنواع ذراتها وطريقة ارتباطها، مثل الماء H₂O وثاني أكسيد الكربون CO₂."],
["Why atoms bond|Pourquoi les atomes se lient|لماذا ترتبط الذرات§A chemical bond holds atoms together. Atoms bond to get a stable outer level of electrons like the noble gases, using their valence (outer-level) electrons.|Une liaison chimique unit les atomes. Les atomes se lient pour obtenir un niveau externe stable comme les gaz nobles, grâce à leurs électrons de valence.|الرابطة الكيميائية قوة تربط الذرات. ترتبط الذرات لتصل إلى مستوى طاقة خارجي مستقر مثل الغازات النبيلة، وذلك عن طريق إلكترونات التكافؤ.",
"Ionic bond|Liaison ionique|الرابطة الأيونية§One atom transfers electrons to another, usually a metal to a non-metal. The ions formed attract each other. In NaCl, Na loses 1 electron (Na⁺) and Cl gains 1 (Cl⁻).|Un atome cède des électrons à un autre, souvent métal vers non-métal ; les ions s'attirent. Dans NaCl, Na perd 1 électron (Na⁺) et Cl en gagne 1 (Cl⁻).|تنتقل إلكترونات من ذرة إلى أخرى، غالبًا من فلز إلى لافلز، فتتجاذب الأيونات المختلفة الشحنة. في NaCl يفقد الصوديوم إلكترونًا (Na⁺) ويكتسبه الكلور (Cl⁻).",
"Covalent bond|Liaison covalente|الرابطة التساهمية§Atoms, usually non-metals, share pairs of electrons and form molecules: H₂, O₂, H₂O, CO₂.|Les atomes, souvent non-métaux, partagent des paires d'électrons et forment des molécules : H₂, O₂, H₂O, CO₂.|تتشارك ذرات اللافلزات غالبًا في أزواج من الإلكترونات وتكوّن جزيئات مثل H₂ وO₂ وH₂O وCO₂.",
"Water and methane|L'eau et le méthane|الماء والميثان§Water: one oxygen shares electrons with two hydrogens (H₂O). Carbon has 4 outer electrons, so it bonds with four hydrogens to form methane CH₄, a simple organic compound.|Eau : un oxygène partage des électrons avec deux hydrogènes (H₂O). Le carbone a 4 électrons externes : il se lie à quatre hydrogènes et donne le méthane CH₄, composé organique simple.|الماء: ذرة أكسجين تتشارك مع ذرتي هيدروجين (H₂O). الكربون له 4 إلكترونات خارجية فيرتبط بأربع ذرات هيدروجين مكوّنًا الميثان CH₄ وهو مركب عضوي بسيط."],
["Electric charge|Charge électrique|الشحنة الكهربية§Atoms are neutral. Rubbing transfers electrons: the object that gains them becomes negative, the one that loses them becomes positive.|Les atomes sont neutres. Le frottement transfère des électrons : qui en gagne devient négatif, qui en perd devient positif.|الذرات متعادلة. الدلك ينقل الإلكترونات؛ فالجسم الذي يكتسبها يصبح سالبًا والذي يفقدها يصبح موجبًا.",
"Electric force|Force électrique|القوة الكهربية§Like charges repel; unlike charges attract. The force grows with bigger charges and a smaller distance. The electric field is the region around a charge where its force acts.|Charges semblables : répulsion ; contraires : attraction. La force augmente avec les charges et diminue avec la distance. Le champ électrique est la région où agit la force.|الشحنات المتشابهة تتنافر والمختلفة تتجاذب، وتزداد القوة بزيادة الشحنتين ونقص المسافة. المجال الكهربي هو المنطقة حول الشحنة التي تظهر فيها قوتها.",
"Conductors and insulators|Conducteurs et isolants|الموصلات والعوازل§Conductors (copper, iron) let charge move easily; insulators (plastic, rubber, glass) do not.|Conducteurs (cuivre, fer) : les charges circulent facilement ; isolants (plastique, caoutchouc, verre) : non.|الموصلات (النحاس والحديد) تسمح بحركة الشحنات بسهولة، والعوازل (البلاستيك والمطاط والزجاج) لا تسمح بذلك.",
"Static electricity|Électricité statique|الكهربية الساكنة§A balloon rubbed on hair sticks to a wall; lightning is a huge natural discharge. Lightning rods lead the charge safely to the ground.|Un ballon frotté sur les cheveux colle au mur ; la foudre est une énorme décharge naturelle. Le paratonnerre évacue la charge vers le sol.|بالون مدلوك بالشعر يلتصق بالحائط، والبرق تفريغ كهربي طبيعي ضخم. وتنقل مانعة الصواعق الشحنة بأمان إلى الأرض."],
["Magnets and poles|Aimants et pôles|المغناطيس والأقطاب§A magnet attracts iron, nickel and cobalt. Forces are strongest at its north and south poles; like poles repel, unlike poles attract. A cut magnet always gives two complete magnets.|Un aimant attire fer, nickel et cobalt. La force est maximale aux pôles nord et sud ; pôles identiques se repoussent, opposés s'attirent. Un aimant coupé donne deux aimants complets.|يجذب المغناطيس الحديد والنيكل والكوبالت، وتكون قوته أكبر ما يمكن عند قطبيه الشمالي والجنوبي. الأقطاب المتشابهة تتنافر والمختلفة تتجاذب. وإذا قُطع المغناطيس نتج مغناطيسان كاملان.",
"Magnetic field|Champ magnétique|المجال المغناطيسي§The region around a magnet where its force acts. Field lines leave the north pole and enter the south pole; closer lines mean a stronger field (iron filings show them).|Région où s'exerce la force. Les lignes sortent du pôle nord et entrent au pôle sud ; plus elles sont serrées, plus le champ est fort (limaille de fer).|المنطقة المحيطة بالمغناطيس التي تظهر فيها قوته. تخرج خطوط المجال من القطب الشمالي وتدخل في الجنوبي، وتدل كثافتها على قوة المجال (يظهرها برادة الحديد).",
"Earth as a magnet|La Terre, un aimant|الأرض كمغناطيس§The Earth behaves like a giant magnet, so a compass needle lines up with its field and points north.|La Terre se comporte comme un énorme aimant : l'aiguille de la boussole s'aligne sur son champ et indique le nord.|تتصرف الأرض كمغناطيس ضخم، فتصطف إبرة البوصلة مع مجالها وتشير إلى الشمال.",
"Electromagnet|Électroaimant|المغناطيس الكهربي§A current in a coil makes a magnet, stronger with more turns, more current and an iron core. Used in cranes, bells and motors.|Un courant dans une bobine crée un aimant, plus fort avec plus de spires, de courant et un noyau de fer. Grues, sonnettes, moteurs.|التيار في ملف يجعله مغناطيسًا، وتزداد قوته بزيادة عدد اللفات وشدة التيار ووجود قلب حديد. يُستخدم في الرافعات والأجراس والمحركات."],
["Gravity|Gravité|الجاذبية§Gravity is the attraction between any two objects that have mass. It is stronger for larger masses and smaller distances.|La gravité est l'attraction entre deux objets ayant une masse ; plus forte pour de grandes masses et de petites distances.|الجاذبية قوة تجاذب بين أي جسمين لهما كتلة، وتزداد بزيادة الكتلتين ونقص المسافة بينهما.",
"Mass and weight|Masse et poids|الكتلة والوزن§Mass (kg) is the amount of matter and never changes; weight (N) is the pull of gravity: W = m × g, with g ≈ 10 N/kg on Earth. A 60 kg student weighs about 600 N on Earth and about 100 N on the Moon, where gravity is one sixth.|Masse (kg) : quantité de matière, constante ; poids (N) : attraction, P = m × g, g ≈ 10 N/kg sur Terre. 60 kg : environ 600 N sur Terre, 100 N sur la Lune (gravité 1/6).|الكتلة (كجم) كمية المادة ولا تتغير؛ والوزن (نيوتن) قوة جذب الأرض: الوزن = الكتلة × g، وg ≈ 10 نيوتن/كجم على الأرض. تلميذ كتلته 60 كجم وزنه نحو 600 نيوتن على الأرض ونحو 100 نيوتن على القمر لأن جاذبيته سدس جاذبية الأرض.",
"Measuring|Mesures|القياس§Mass is measured with a beam balance (kg); weight with a spring balance (newton).|Masse : balance à fléau (kg) ; poids : dynamomètre (newton).|تُقاس الكتلة بالميزان ذي الكفتين (كجم) ويُقاس الوزن بالميزان الزنبركي (نيوتن).",
"Effects of gravity|Effets de la gravité|تأثيرات الجاذبية§Objects fall to the ground, the Moon orbits the Earth and the planets orbit the Sun because of gravity.|Les objets tombent, la Lune tourne autour de la Terre et les planètes autour du Soleil grâce à la gravité.|تسقط الأجسام نحو الأرض ويدور القمر حول الأرض وتدور الكواكب حول الشمس بفعل الجاذبية."],
["The cell|La cellule|الخلية§The cell is the basic unit of structure and function of living things. Some organisms have one cell, others (like humans) trillions. Cells are seen with a microscope.|La cellule est l'unité de base de structure et de fonction du vivant. Certains êtres n'ont qu'une cellule, d'autres des billions. On l'observe au microscope.|الخلية وحدة البناء والوظيفة في الكائنات الحية. بعضها وحيد الخلية وبعضها (كالإنسان) يتكون من تريليونات الخلايا، وتُرى بالمجهر.",
"Cell parts|Parties de la cellule|أجزاء الخلية§Membrane: controls what enters and leaves. Nucleus: controls the cell. Cytoplasm: jelly where reactions happen. Mitochondria: release energy. Vacuole: stores substances.|Membrane : contrôle les échanges. Noyau : dirige la cellule. Cytoplasme : milieu des réactions. Mitochondries : énergie. Vacuole : stockage.|الغشاء ينظم دخول المواد وخروجها، والنواة تتحكم في الخلية، والسيتوبلازم تحدث فيه التفاعلات، والميتوكوندريا تحرر الطاقة، والفجوة تخزن المواد.",
"Plant and animal cells|Cellules végétale et animale|الخلية النباتية والحيوانية§Plant cells also have a cell wall, chloroplasts (photosynthesis) and a large vacuole; animal cells do not.|La cellule végétale a en plus paroi, chloroplastes (photosynthèse) et grande vacuole ; pas la cellule animale.|تنفرد الخلية النباتية بالجدار الخلوي والبلاستيدات الخضراء (البناء الضوئي) وفجوة كبيرة، ولا توجد في الخلية الحيوانية.",
"Levels of organisation|Niveaux d'organisation|مستويات التنظيم§Cell → tissue → organ → system → organism.|Cellule → tissu → organe → système → organisme.|خلية ← نسيج ← عضو ← جهاز ← كائن حي."],
["Life processes|Processus vitaux|العمليات الحيوية§All living things show nutrition, respiration, growth, response to stimuli, reproduction and excretion.|Tout être vivant présente nutrition, respiration, croissance, réaction aux stimuli, reproduction et excrétion.|كل الكائنات الحية تقوم بالتغذية والتنفس والنمو والاستجابة للمؤثرات والتكاثر والإخراج.",
"Nutrition|Nutrition|التغذية§Plants make their own food by photosynthesis; animals get food by eating plants or other animals.|Les plantes fabriquent leur nourriture par photosynthèse ; les animaux mangent plantes ou animaux.|النباتات تصنع غذاءها بالبناء الضوئي، والحيوانات تحصل عليه بأكل النباتات أو حيوانات أخرى.",
"Respiration|Respiration|التنفس§Cells release energy from food using oxygen: glucose + oxygen → carbon dioxide + water + energy.|Les cellules libèrent l'énergie des aliments avec l'oxygène : glucose + oxygène → CO₂ + eau + énergie.|تحرر الخلايا الطاقة من الغذاء باستخدام الأكسجين: جلوكوز + أكسجين ← ثاني أكسيد الكربون + ماء + طاقة.",
"Other processes|Autres processus|عمليات أخرى§Growth: more cells and size. Response: reacting to a stimulus. Reproduction: new individuals of the same kind. Excretion: removing wastes. Rocks and water do not do all of these.|Croissance : plus de cellules. Réponse : réaction à un stimulus. Reproduction : nouveaux individus. Excrétion : élimination des déchets. Roches et eau ne font pas tout cela.|النمو زيادة الحجم وعدد الخلايا، الاستجابة رد فعل لمؤثر، التكاثر إنتاج أفراد جديدة، الإخراج التخلص من الفضلات. أما الصخور والماء فلا تقوم بكل ذلك."],
["Types of microbes|Types de microbes|أنواع الميكروبات§Microbes are tiny organisms seen only with a microscope: bacteria, viruses, fungi and protozoa. Viruses are not cells and multiply only inside a host.|Organismes visibles seulement au microscope : bactéries, virus, champignons, protozoaires. Les virus ne sont pas des cellules et se multiplient dans un hôte.|كائنات دقيقة لا تُرى إلا بالمجهر: بكتيريا وفيروسات وفطريات وأوليات. والفيروس ليس خلية ولا يتكاثر إلا داخل خلية عائل.",
"Harmful microbes|Microbes nuisibles|الميكروبات الضارة§They cause diseases such as cholera and the flu, and they spoil food.|Ils causent des maladies (choléra, grippe) et abîment les aliments.|تسبب أمراضًا مثل الكوليرا والإنفلونزا وتُفسد الأغذية.",
"Useful microbes|Microbes utiles|الميكروبات النافعة§Yeast makes bread rise; some bacteria make yoghurt and cheese; decomposers recycle dead matter; some fungi give antibiotics.|La levure fait lever le pain ; des bactéries font yaourt et fromage ; les décomposeurs recyclent la matière ; certains champignons donnent des antibiotiques.|الخميرة في الخبز وبعض البكتيريا في الزبادي والجبن، والمحللات تعيد تدوير المخلفات، وبعض الفطريات تعطي المضادات الحيوية.",
"Prevention|Prévention|الوقاية§Wash hands, cook and refrigerate food, drink clean water and get vaccinated. Antibiotics act on bacteria, not on viruses.|Se laver les mains, cuire et réfrigérer les aliments, boire de l'eau propre, se vacciner. Les antibiotiques agissent sur les bactéries, pas sur les virus.|غسل اليدين وطهي الطعام وتبريده وشرب مياه نظيفة والتطعيم. والمضادات الحيوية تؤثر في البكتيريا لا في الفيروسات."],
["The solar system|Le système solaire|النظام الشمسي§The Sun (a star) and everything orbiting it: 8 planets, their moons, asteroids and comets. Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.|Le Soleil (une étoile) et ce qui l'orbite : 8 planètes, leurs lunes, astéroïdes et comètes. Ordre : Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus, Neptune.|الشمس (نجم) وكل ما يدور حولها: 8 كواكب وأقمارها والكويكبات والمذنبات. الترتيب: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون.",

  tx.update(uR,{xp:d.xp,coins:d.coins,totalCoinsEarned:d.total,ach:d.ach,achPaid:d.paid,log,t:now,updated:now});
  tx.set(lR,adLb({...o,...d,total:d.total,sec:Number(c.activeSeconds)||0,name:c.name||o.name,photo:c.photo||""},now));
  tx.set(fb.doc(fb.collection(fb.db,"adminLogs")),{admin:user.uid,target:o.uid,at:now,before:{xp:o.xp,coins:o.coins,total:o.total},after:{xp:d.xp,coins:d.coins,total:d.total}});

}

 const amt=id=>{const n=nInt(q(id).value,1);if(n===null)toast("Enter an amount of at least 1");return n};
 m.onclick=e=>{const b=e.target.closest("button");if(!b)return;const op=b.dataset.op,ac=b.dataset.ach;
  if(!read())return;

  if(op==="coAdd"||op==="coSub"){const n=amt("#aCoA");if(n===null)return;if(op==="coAdd"){d.coins=Math.min(1e9,d.coins+n);if(q("#aLife").checked)d.total=Math.min(1e9,d.total+n)}else d.coins=Math.max(0,d.coins-n)}

function startActiveTracking(){
  if(activeTimer)clearInterval(activeTimer);
  let last=Date.now();
  activeTimer=setInterval(()=>{
    const now=Date.now(),delta=Math.max(0,Math.min(15,(now-last)/1000));last=now;
    if(!user||user.guest||!S||document.visibilityState!=="visible"||!document.hasFocus())return;
    S.activeSeconds=(Number(S.activeSeconds)||0)+delta;
    save();
  },10000);
  document.addEventListener("visibilitychange",()=>{last=Date.now()});
  window.addEventListener("focus",()=>{last=Date.now()});
  window.addEventListener("blur",()=>{last=Date.now()});
}
