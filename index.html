<style>
:root{--ok:#22c55e;--no:#ef4444}
[data-theme=black]{--a:#bdbdbd;--b:#ffffff;--bgd:#050505;--bgl:#f1f1f1}

[data-theme=purple]{--a:#c084fc;--b:#6366f1;--bgd:#0d0620;--bgl:#f6efff}
[data-theme=green]{--a:#34d399;--b:#22c55e;--bgd:#04140d;--bgl:#ecfdf5}
[data-shape=sharp]{--r:4px}[data-shape=bubble]{--r:34px}[data-shape=neon]{--r:12px}[data-shape=neon] .card{border-color:var(--a);box-shadow:0 0 16px var(--a),inset 0 0 16px color-mix(in srgb,var(--a) 20%,transparent)}
[data-mode=dark]{--bg:var(--bgd);--card:#ffffff0e;--line:#ffffff2a;--tx:#f1f5ff;--mu:#9aa8c7;--nav:#00000055}

[data-theme=glass][data-mode=light]{--card:#ffffff94;--line:#ffffffd9;--nav:#ffffff80}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 12% 0,color-mix(in srgb,var(--a) 26%,transparent),transparent 55%),radial-gradient(circle at 92% 100%,color-mix(in srgb,var(--b) 22%,transparent),transparent 50%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
[data-theme=glass][data-mode=light] body{background:radial-gradient(circle at 15% 10%,#cfe0ff,transparent 50%),radial-gradient(circle at 85% 90%,#f1d6ff,transparent 50%),linear-gradient(135deg,#ffffff,#eef3ff)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r,18px);padding:16px;backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:0 0 22px color-mix(in srgb,var(--a) 14%,transparent)}
[data-theme=glass] .card{background:linear-gradient(135deg,#ffffff30,#ffffff0a);backdrop-filter:blur(26px) saturate(180%)}
[data-theme=glass][data-mode=light] .card{background:linear-gradient(135deg,#ffffffcc,#ffffff70)}
.btn{background:linear-gradient(135deg,var(--a),var(--b));color:#06101f;border:0;border-radius:calc(var(--r,18px)*.7);padding:10px 18px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}.btn:disabled{opacity:.5}
.hidden{display:none!important}.mu{color:var(--mu)}h1,h2,h3{margin:0 0 10px}
#loader,#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 30%,#12296a,#030610);color:#e8f1ff;transition:opacity .6s}#loader.out{opacity:0;pointer-events:none}
.logo{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;letter-spacing:.18em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent;animation:pu 2s infinite alternate}@keyframes pu{to{filter:drop-shadow(0 0 22px var(--b))}}
.bar{width:min(80vw,420px);height:10px;border-radius:9px;background:#ffffff22;overflow:hidden}.bar i,.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.xp{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
#login .card{max-width:380px;width:90vw;text-align:center;background:#0b1633cc;color:#e8f1ff}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:var(--nav);border-inline-end:1px solid var(--line);backdrop-filter:blur(18px)}
nav .logo{font-size:1.15rem;margin:4px 8px 12px}
nav button{background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;text-align:start;color:var(--mu);transition:.2s}
nav button.on,nav button:hover{color:var(--tx);border-color:var(--line);background:color-mix(in srgb,var(--a) 16%,transparent)}
main{padding:18px;min-width:0;max-width:1100px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.85rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lc{text-align:start;cursor:pointer;transition:.2s;color:inherit}.lc:hover{transform:translateY(-3px);border-color:var(--a)}.big{font-size:2rem}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:11px 13px;border-radius:calc(var(--r,18px)*.65);border:1px solid var(--line);background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--a)}.opt.ok{border-color:var(--ok);background:#22c55e33}.opt.no{border-color:var(--no);background:#ef444433}.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 25%,transparent)}
input[type=search],input[type=text],input:not([type]),select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.72rem;padding:6px}.mc.up{border-color:var(--a)}.mc.ok{border-color:var(--ok);background:#22c55e33}
.mrow{margin:8px 0}.scr{letter-spacing:.2em;font-size:1.8rem;text-align:center}
.term{margin:10px 0}.term b{color:var(--a)}.tag{font-size:.8rem;color:var(--mu)}
.badge{opacity:.4;filter:grayscale(1)}.badge.got{opacity:1;filter:none;border-color:var(--a)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.sw button.on{border-color:var(--a);box-shadow:0 0 12px var(--a)}
#labFrame{width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:14px;background:#07182a}
#toast{position:fixed;top:12px;inset-inline-end:12px;z-index:99;display:flex;flex-direction:column;gap:8px}#toast div{padding:10px 16px;border-radius:12px;background:#0b1a3cf2;color:#fff;border:1px solid var(--a);animation:in .3s}@keyframes in{from{transform:translateY(-10px);opacity:0}}
.sv{width:100%;max-width:560px;display:block;margin:auto}.sv text{fill:var(--tx);font-size:11px;font-family:inherit}.fig{padding:10px}.key{margin-top:10px;padding:12px;border-radius:12px;border:1px dashed var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}.vin{animation:vin .4s ease}@keyframes vin{from{opacity:0;transform:translateY(10px)}}.opt.ok{animation:pop .3s}@keyframes pop{50%{transform:scale(1.03)}}#tl{font-size:1.2rem}
.sw2{height:48px;margin-bottom:8px;border-radius:12px}.inl{width:auto;display:inline-block;margin:0 6px}#ll{margin-bottom:10px}#ll,#login .sw{justify-content:center}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;border-inline-end:0;border-top:1px solid var(--line)}nav .logo{display:none}nav button{white-space:nowrap;font-size:.85rem;padding:8px 10px}main{padding:12px 12px 78px}#labFrame{height:calc(100vh - 200px)}.mem{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}

[0,"🧪","Matter and Its Properties|La matière et ses propriétés|المادة وخصائصها",["Matter|Matière|المادة§Anything that has mass and occupies space.|Tout ce qui a une masse et occupe un volume.|كل ما له كتلة ويشغل حيزًا من الفراغ.","Density|Masse volumique|الكثافة§The mass of a unit volume of a substance.|La masse d'une unité de volume d'une substance.|كتلة وحدة الحجوم من المادة.","Mixture|Mélange|الخليط§Two or more substances mixed without chemical joining; each keeps its own properties.|Deux substances ou plus mélangées sans union chimique ; chacune garde ses propriétés.|مادتان أو أكثر مخلوطتان دون اتحاد كيميائي، وتحتفظ كل منهما بخواصها."]],
[0,"🔗","Chemical Bonds|Les liaisons chimiques|الروابط الكيميائية",["Chemical bond|Liaison chimique|الرابطة الكيميائية§A force that holds atoms together.|Force qui maintient les atomes ensemble.|قوة تربط الذرات معًا.","Valence electrons|Électrons de valence|إلكترونات التكافؤ§The electrons in the outermost energy level of an atom.|Les électrons du dernier niveau d'énergie d'un atome.|الإلكترونات الموجودة في مستوى الطاقة الأخير للذرة.","Ionic bond|Liaison ionique|الرابطة الأيونية§A bond formed when electrons are transferred from one atom to another.|Liaison formée lorsque des électrons passent d'un atome à un autre.|رابطة تنشأ بانتقال إلكترونات من ذرة إلى أخرى.","Covalent bond|Liaison covalente|الرابطة التساهمية§A bond formed when atoms share electrons.|Liaison formée lorsque des atomes partagent des électrons.|رابطة تنشأ بمشاركة الذرات في الإلكترونات."]],
[1,"⚡","Electric Forces|Les forces électriques|القوى الكهربية",["Electric charge|Charge électrique|الشحنة الكهربية§A property of matter; it can be positive or negative.|Propriété de la matière ; elle peut être positive ou négative.|خاصية للمادة، وقد تكون موجبة أو سالبة.","Electric force|Force électrique|القوة الكهربية§The force between charged objects: like charges repel, unlike charges attract.|Force entre objets chargés : les charges de même signe se repoussent, de signes contraires s'attirent.|القوة بين الأجسام المشحونة: الشحنات المتشابهة تتنافر والمختلفة تتجاذب.","Static electricity|Électricité statique|الكهربية الساكنة§The build-up of electric charge on an object, for example by rubbing.|Accumulation de charges électriques sur un objet, par exemple par frottement.|تراكم الشحنات الكهربية على جسم، مثل ما يحدث بالدلك."]],
[1,"🧲","Magnetic Forces|Les forces magnétiques|القوى المغناطيسية",["Magnet|Aimant|المغناطيس§An object that attracts iron, nickel and cobalt.|Objet qui attire le fer, le nickel et le cobalt.|جسم يجذب الحديد والنيكل والكوبالت.","Magnetic poles|Pôles magnétiques|الأقطاب المغناطيسية§The north and south ends of a magnet: like poles repel, unlike poles attract.|Les extrémités nord et sud d'un aimant : pôles identiques se repoussent, opposés s'attirent.|الطرفان الشمالي والجنوبي للمغناطيس: المتشابهة تتنافر والمختلفة تتجاذب.","Magnetic field|Champ magnétique|المجال المغناطيسي§The region around a magnet where its force can be felt.|Région autour d'un aimant où sa force se fait sentir.|المنطقة المحيطة بالمغناطيس التي تظهر فيها قوته."]],
[1,"🍎","Gravitational Forces|Les forces de gravitation|قوى الجاذبية",["Gravity|Gravité|الجاذبية§The force of attraction between any two objects that have mass.|Force d'attraction entre deux objets ayant une masse.|قوة تجاذب بين أي جسمين لهما كتلة.","Mass|Masse|الكتلة§The amount of matter in an object, measured in kilograms; it does not change with place.|Quantité de matière d'un objet, mesurée en kilogrammes ; elle ne change pas selon le lieu.|كمية المادة في الجسم وتقاس بالكيلوجرام، ولا تتغير بتغير المكان.","Weight|Poids|الوزن§The force of gravity on an object, measured in newtons; it changes with place.|Force de gravité exercée sur un objet, mesurée en newtons ; elle change selon le lieu.|قوة جذب الأرض للجسم ويقاس بالنيوتن، ويتغير بتغير المكان."]],
[2,"🔬","Cells and Life|Les cellules et la vie|الخلايا والحياة",["Cell|Cellule|الخلية§The basic unit of structure and function of living organisms.|Unité de base de la structure et du fonctionnement des êtres vivants.|وحدة البناء والوظيفة في الكائنات الحية.","Nucleus|Noyau|النواة§The part of the cell that controls its activities.|Partie de la cellule qui contrôle ses activités.|الجزء الذي يتحكم في أنشطة الخلية.","Cell membrane|Membrane cellulaire|الغشاء الخلوي§The thin layer around the cell that controls what enters and leaves.|Fine couche autour de la cellule qui contrôle ce qui entre et sort.|غشاء رقيق يحيط بالخلية وينظم دخول المواد وخروجها.","Chloroplast|Chloroplaste|البلاستيدة الخضراء§A part of plant cells where photosynthesis takes place.|Partie des cellules végétales où a lieu la photosynthèse.|جزء في الخلية النباتية تتم فيه عملية البناء الضوئي."]],

2:["Solid|Solide|الحالة الصلبة§A state of matter with a fixed shape and a fixed volume.|État de la matière à forme et volume fixes.|حالة للمادة لها شكل وحجم ثابتان.","Liquid|Liquide|الحالة السائلة§A state of matter with a fixed volume that takes the shape of its container.|État de la matière à volume fixe qui prend la forme de son récipient.|حالة للمادة لها حجم ثابت وتأخذ شكل الإناء.","Gas|Gaz|الحالة الغازية§A state of matter with no fixed shape or volume.|État de la matière sans forme ni volume fixes.|حالة للمادة ليس لها شكل أو حجم ثابت.","Melting point|Point de fusion|درجة الانصهار§The temperature at which a solid changes into a liquid.|Température à laquelle un solide devient liquide.|درجة الحرارة التي يتحول عندها الجسم الصلب إلى سائل.","Boiling point|Point d'ébullition|درجة الغليان§The temperature at which a liquid changes into a gas.|Température à laquelle un liquide devient gaz.|درجة الحرارة التي يتحول عندها السائل إلى غاز.","Volume|Volume|الحجم§The space that a substance occupies.|L'espace occupé par une substance.|الحيز الذي تشغله المادة.","Pure substance|Substance pure|المادة النقية§A substance made of only one kind of particle.|Substance formée d'un seul type de particules.|مادة تتكون من نوع واحد فقط من الجسيمات."],

7:["Cytoplasm|Cytoplasme|السيتوبلازم§The jelly-like material inside the cell where many reactions take place.|Substance gélatineuse de la cellule où ont lieu de nombreuses réactions.|المادة الهلامية داخل الخلية وتحدث فيها تفاعلات كثيرة.","Cell wall|Paroi cellulaire|الجدار الخلوي§A rigid layer outside the cell membrane of plant cells that supports the cell.|Couche rigide autour de la membrane des cellules végétales qui les soutient.|طبقة صلبة خارج الغشاء الخلوي في الخلية النباتية تدعمها.","Photosynthesis|Photosynthèse|البناء الضوئي§The process by which plants use light to make food from carbon dioxide and water.|Processus par lequel les plantes fabriquent leur nourriture avec la lumière, le dioxyde de carbone et l'eau.|عملية تصنع بها النباتات غذاءها باستخدام الضوء وثاني أكسيد الكربون والماء.","Microscope|Microscope|المجهر§An instrument that magnifies very small objects such as cells.|Instrument qui grossit de très petits objets comme les cellules.|أداة تكبّر الأجسام الدقيقة جدًا مثل الخلايا.","Unicellular|Unicellulaire|وحيد الخلية§An organism made of a single cell.|Être vivant formé d'une seule cellule.|كائن حي يتكون من خلية واحدة.","Multicellular|Pluricellulaire|عديد الخلايا§An organism made of many cells.|Être vivant formé de plusieurs cellules.|كائن حي يتكون من عدد كبير من الخلايا."],
8:["Nutrition|Nutrition|التغذية§Taking in the food an organism needs.|Fait de prendre les aliments dont l'organisme a besoin.|حصول الكائن الحي على الغذاء الذي يحتاجه.","Excretion|Excrétion|الإخراج§Getting rid of waste products from the body.|Élimination des déchets de l'organisme.|التخلص من الفضلات الناتجة عن العمليات الحيوية.","Stimulus|Stimulus|المؤثر§A change in the environment that an organism responds to.|Changement de l'environnement auquel un être vivant réagit.|تغير في البيئة يستجيب له الكائن الحي."],
9:["Fungi|Champignons|الفطريات§Organisms such as yeast and mould; some cause disease and some are useful.|Organismes comme la levure et les moisissures ; certains causent des maladies, d'autres sont utiles.|كائنات مثل الخميرة والعفن، بعضها يسبب أمراضًا وبعضها نافع.","Disease|Maladie|المرض§A condition that stops the body working normally; some are caused by microbes.|État qui empêche l'organisme de fonctionner normalement ; certaines sont causées par des microbes.|حالة تمنع الجسم من العمل بصورة طبيعية، وبعضها تسببه الميكروبات.","Vaccine|Vaccin|اللقاح§A preparation that helps the body build protection against a disease.|Préparation qui aide l'organisme à se protéger contre une maladie.|مستحضر يساعد الجسم على بناء مناعة ضد مرض.","Yeast|Levure|الخميرة§A single-celled fungus used to make bread.|Champignon unicellulaire utilisé pour faire le pain.|فطر وحيد الخلية يستخدم في صناعة الخبز."],
10:["Sun|Soleil|الشمس§The star at the centre of the solar system.|L'étoile au centre du système solaire.|النجم الذي يقع في مركز النظام الشمسي.","Earth|Terre|الأرض§The third planet from the Sun, the planet we live on.|Troisième planète à partir du Soleil, celle où nous vivons.|الكوكب الثالث بعدًا عن الشمس والكوكب الذي نعيش عليه.","Moon|Lune|القمر§A natural satellite that orbits the Earth.|Satellite naturel qui tourne autour de la Terre.|جرم طبيعي (تابع) يدور حول الأرض.","Star|Étoile|النجم§A huge ball of hot gas that makes its own light and heat, like the Sun.|Énorme boule de gaz chaud qui produit sa propre lumière et chaleur, comme le Soleil.|كرة ضخمة من الغازات الساخنة تنتج الضوء والحرارة بنفسها مثل الشمس.","Orbit|Orbite|المدار§The path of a body moving around another body.|Trajectoire d'un corps autour d'un autre.|المسار الذي يتحرك فيه جرم حول جرم آخر.","Axis|Axe|محور الأرض§The imaginary line through the Earth from the North Pole to the South Pole.|Ligne imaginaire traversant la Terre du pôle Nord au pôle Sud.|خط وهمي يمر بالأرض من القطب الشمالي إلى القطب الجنوبي.","Asteroid|Astéroïde|الكويكب§A small rocky body that orbits the Sun, mostly between Mars and Jupiter.|Petit corps rocheux qui tourne autour du Soleil, surtout entre Mars et Jupiter.|جرم صخري صغير يدور حول الشمس، معظمه بين المريخ والمشتري.","Comet|Comète|المذنب§A body of ice and dust that orbits the Sun and grows a tail near it.|Corps de glace et de poussière qui tourne autour du Soleil et développe une queue près de lui.|جرم من الجليد والغبار يدور حول الشمس ويظهر له ذيل عند اقترابه منها."],
11:["Moon phases|Phases de la Lune|أطوار القمر§The different shapes of the Moon that we see as it orbits the Earth.|Formes différentes de la Lune vues au cours de sa révolution autour de la Terre.|الأشكال المختلفة للقمر كما نراها أثناء دورانه حول الأرض.","Total lunar eclipse|Éclipse lunaire totale|الخسوف الكلي§When the whole Moon enters the darkest part of the Earth's shadow.|Quand toute la Lune entre dans la partie la plus sombre de l'ombre de la Terre.|عندما يدخل القمر كله في أظلم جزء من ظل الأرض.","Partial lunar eclipse|Éclipse lunaire partielle|الخسوف الجزئي§When only part of the Moon enters the Earth's shadow.|Quand une partie seulement de la Lune entre dans l'ombre de la Terre.|عندما يدخل جزء فقط من القمر في ظل الأرض."]};

["Everything around us is made of tiny particles called atoms. In the centre of the atom is the nucleus, which contains protons and neutrons, while electrons move around it in energy levels.|Tout ce qui nous entoure est formé de minuscules particules appelées atomes. Au centre de l'atome se trouve le noyau, qui contient des protons et des neutrons, tandis que les électrons se déplacent autour dans des niveaux d'énergie.|كل ما حولنا يتكون من جسيمات صغيرة جدًا تسمى الذرات. في مركز الذرة توجد النواة وتحتوي على البروتونات والنيوترونات، بينما تتحرك الإلكترونات حولها في مستويات الطاقة.","Protons are positive, electrons are negative and neutrons have no charge. In a neutral atom the number of protons equals the number of electrons, so the charges cancel out.|Les protons sont positifs, les électrons négatifs et les neutrons n'ont pas de charge. Dans un atome neutre, le nombre de protons est égal au nombre d'électrons : les charges s'annulent.|البروتونات موجبة والإلكترونات سالبة والنيوترونات متعادلة. وفي الذرة المتعادلة يتساوى عدد البروتونات مع عدد الإلكترونات فتتعادل الشحنات.","Atomic number = number of protons. Mass number = protons + neutrons.|Numéro atomique = nombre de protons. Nombre de masse = protons + neutrons.|العدد الذري = عدد البروتونات. العدد الكتلي = عدد البروتونات + عدد النيوترونات."],
["The periodic table arranges the elements in order of increasing atomic number. It contains 118 elements.|Le tableau périodique classe les éléments par numéro atomique croissant. Il contient 118 éléments.|يرتب الجدول الدوري العناصر تصاعديًا حسب العدد الذري، ويحتوي على 118 عنصرًا.","The horizontal rows are called periods and the vertical columns are called groups. Elements in the same group have similar properties because they have the same number of electrons in their outer energy level.|Les lignes horizontales sont les périodes et les colonnes verticales sont les groupes. Les éléments d'un même groupe ont des propriétés semblables car ils ont le même nombre d'électrons sur leur dernier niveau d'énergie.|الصفوف الأفقية تسمى دورات والأعمدة الرأسية تسمى مجموعات. عناصر المجموعة الواحدة متشابهة في خواصها لأن لها نفس عدد الإلكترونات في مستوى الطاقة الأخير.","Elements are classified as metals, non-metals and metalloids. Group 18 contains the unreactive noble gases.|Les éléments se classent en métaux, non-métaux et métalloïdes. Le groupe 18 contient les gaz nobles, très peu réactifs.|تُصنَّف العناصر إلى فلزات ولافلزات وأشباه فلزات. وتضم المجموعة 18 الغازات النبيلة قليلة النشاط."],
["Matter is anything that has mass and occupies space. It exists in three common states: solid, liquid and gas.|La matière est tout ce qui a une masse et occupe un volume. Elle existe sous trois états courants : solide, liquide et gaz.|المادة هي كل ما له كتلة ويشغل حيزًا من الفراغ، وتوجد في ثلاث حالات شائعة: صلبة وسائلة وغازية.","In a solid the particles are tightly packed, so it has a fixed shape and volume. A liquid has a fixed volume but takes the shape of its container. A gas has no fixed shape or volume and fills its container.|Dans un solide, les particules sont serrées : forme et volume fixes. Un liquide a un volume fixe mais prend la forme de son récipient. Un gaz n'a ni forme ni volume fixes et remplit son récipient.|في المادة الصلبة تكون الجسيمات متراصة فلها شكل وحجم ثابتان. السائل له حجم ثابت ويأخذ شكل الإناء. أما الغاز فليس له شكل أو حجم ثابت ويملأ الإناء الذي يوضع فيه.","Density = mass ÷ volume. Melting point and boiling point also help us identify substances.|Masse volumique = masse ÷ volume. Les points de fusion et d'ébullition aident aussi à identifier les substances.|الكثافة = الكتلة ÷ الحجم. وتساعدنا درجتا الانصهار والغليان أيضًا في التعرف على المواد."],
["Atoms form chemical bonds to reach a stable arrangement of electrons in their outer energy level, like the noble gases.|Les atomes forment des liaisons chimiques pour atteindre une disposition stable des électrons sur leur dernier niveau d'énergie, comme les gaz nobles.|ترتبط الذرات بروابط كيميائية لتصل إلى ترتيب مستقر للإلكترونات في مستوى الطاقة الأخير، مثل الغازات النبيلة.","In an ionic bond, one atom transfers electrons to another (usually a metal to a non-metal). The oppositely charged ions attract each other, as in sodium chloride (NaCl).|Dans une liaison ionique, un atome cède des électrons à un autre (souvent un métal à un non-métal). Les ions de charges opposées s'attirent, comme dans le chlorure de sodium (NaCl).|في الرابطة الأيونية تنتقل إلكترونات من ذرة إلى أخرى (غالبًا من فلز إلى لافلز)، فتتجاذب الأيونات المختلفة الشحنة كما في كلوريد الصوديوم NaCl.","In a covalent bond, atoms (usually non-metals) share electrons and form molecules, such as water (H₂O).|Dans une liaison covalente, les atomes (souvent des non-métaux) partagent des électrons et forment des molécules, comme l'eau (H₂O).|في الرابطة التساهمية تتشارك الذرات (غالبًا اللافلزات) في الإلكترونات وتكوّن جزيئات مثل الماء H₂O."],
["An object becomes charged when it gains or loses electrons. Gaining electrons makes it negative; losing electrons makes it positive.|Un objet devient chargé lorsqu'il gagne ou perd des électrons. S'il en gagne, il est négatif ; s'il en perd, il est positif.|يصبح الجسم مشحونًا عندما يكتسب إلكترونات أو يفقدها. اكتساب الإلكترونات يجعله سالب الشحنة، وفقدانها يجعله موجب الشحنة.","Like charges repel and unlike charges attract. The force is stronger when the charges are larger and the distance between them is smaller.|Les charges de même signe se repoussent et celles de signes contraires s'attirent. La force est plus grande quand les charges sont grandes et la distance petite.|الشحنات المتشابهة تتنافر والمختلفة تتجاذب. وتزداد القوة بزيادة الشحنتين وبنقصان المسافة بينهما.","Rubbing a balloon on your hair transfers electrons and produces static electricity. Lightning is a large natural example.|Frotter un ballon sur les cheveux transfère des électrons et produit de l'électricité statique. La foudre en est un grand exemple naturel.|دلك البالون بالشعر ينقل الإلكترونات وينتج كهربية ساكنة. والبرق مثال طبيعي كبير على ذلك."],
["A magnet attracts objects made of iron, nickel and cobalt. Every magnet has two poles, north and south, where its force is strongest.|Un aimant attire les objets en fer, nickel et cobalt. Tout aimant a deux pôles, nord et sud, où sa force est la plus grande.|يجذب المغناطيس الأجسام المصنوعة من الحديد والنيكل والكوبالت. ولكل مغناطيس قطبان شمالي وجنوبي تكون القوة عندهما أكبر ما يمكن.","Like poles repel and unlike poles attract. If you cut a magnet in half, each piece still has a north and a south pole.|Les pôles identiques se repoussent et les pôles opposés s'attirent. Si l'on coupe un aimant en deux, chaque morceau a toujours un pôle nord et un pôle sud.|الأقطاب المتشابهة تتنافر والمختلفة تتجاذب. وإذا قُطع المغناطيس إلى نصفين يصبح لكل جزء قطبان شمالي وجنوبي.","The magnetic field is the region around a magnet where its force acts. The Earth behaves like a giant magnet, which is why a compass points north.|Le champ magnétique est la région autour d'un aimant où s'exerce sa force. La Terre se comporte comme un énorme aimant, c'est pourquoi la boussole indique le nord.|المجال المغناطيسي هو المنطقة المحيطة بالمغناطيس التي تظهر فيها قوته. والأرض تتصرف كمغناطيس ضخم، ولذلك تشير البوصلة إلى الشمال."],
["Gravity is the force of attraction between any two objects that have mass. The larger the masses and the closer the objects, the stronger the force.|La gravité est la force d'attraction entre deux objets quelconques ayant une masse. Plus les masses sont grandes et plus les objets sont proches, plus la force est grande.|الجاذبية قوة تجاذب بين أي جسمين لهما كتلة، وتزداد كلما زادت الكتلتان وقلّت المسافة بينهما.","The Earth's gravity pulls objects towards its centre, so things fall. Gravity also keeps the Moon orbiting the Earth and the planets orbiting the Sun.|La gravité terrestre attire les objets vers son centre : c'est pourquoi les objets tombent. Elle maintient aussi la Lune en orbite autour de la Terre et les planètes autour du Soleil.|تجذب جاذبية الأرض الأجسام نحو مركزها فتسقط. كما تُبقي الجاذبية القمر في مداره حول الأرض والكواكب في مداراتها حول الشمس.","Mass (kg) stays the same everywhere, but weight (N) depends on gravity. On the Moon gravity is about one sixth of Earth's, so objects weigh less there.|La masse (kg) est la même partout, mais le poids (N) dépend de la gravité. Sur la Lune, la gravité vaut environ un sixième de celle de la Terre : les objets y pèsent moins.|الكتلة (كجم) ثابتة في كل مكان، أما الوزن (نيوتن) فيعتمد على الجاذبية. وجاذبية القمر نحو سدس جاذبية الأرض، فيقل وزن الأجسام عليه."],
["The cell is the basic unit of structure and function in all living organisms. Some organisms have only one cell, while others, like humans, have trillions.|La cellule est l'unité de base de la structure et du fonctionnement de tous les êtres vivants. Certains n'ont qu'une cellule, d'autres, comme l'être humain, en ont des milliers de milliards.|الخلية هي وحدة البناء والوظيفة في جميع الكائنات الحية. بعض الكائنات وحيدة الخلية وبعضها، مثل الإنسان، يتكون من تريليونات الخلايا.","The cell membrane controls what enters and leaves, the nucleus controls the cell's activities, and the cytoplasm is the jelly-like material where many reactions take place.|La membrane contrôle ce qui entre et sort, le noyau dirige les activités de la cellule, et le cytoplasme est la substance gélatineuse où ont lieu de nombreuses réactions.|الغشاء الخلوي ينظم دخول المواد وخروجها، والنواة تتحكم في أنشطة الخلية، والسيتوبلازم مادة هلامية تحدث فيها تفاعلات كثيرة.","Plant cells also have a cell wall and chloroplasts (where photosynthesis happens); animal cells do not.|Les cellules végétales ont aussi une paroi et des chloroplastes (où a lieu la photosynthèse) ; pas les cellules animales.|تتميز الخلية النباتية بوجود جدار خلوي وبلاستيدات خضراء (يتم فيها البناء الضوئي)، ولا توجد في الخلية الحيوانية."],
["All living organisms carry out life processes: nutrition, respiration, growth, response to stimuli, reproduction and excretion.|Tous les êtres vivants réalisent des processus vitaux : nutrition, respiration, croissance, réaction aux stimuli, reproduction et excrétion.|تقوم جميع الكائنات الحية بعمليات حيوية هي: التغذية والتنفس والنمو والاستجابة للمؤثرات والتكاثر والإخراج.","Respiration releases energy from food, growth increases the size and number of cells, and reproduction produces new individuals of the same kind.|La respiration libère l'énergie des aliments, la croissance augmente la taille et le nombre de cellules, et la reproduction produit de nouveaux individus de la même espèce.|التنفس يحرر الطاقة من الغذاء، والنمو يزيد حجم الكائن وعدد خلاياه، والتكاثر ينتج أفرادًا جديدة من النوع نفسه.","Non-living things, such as rocks and water, do not carry out all of these processes.|Les objets non vivants, comme les roches et l'eau, ne réalisent pas tous ces processus.|الأشياء غير الحية، مثل الصخور والماء، لا تقوم بكل هذه العمليات."],
["Microbes are tiny organisms that can only be seen with a microscope. The main types include bacteria, viruses and fungi.|Les microbes sont de minuscules organismes visibles seulement au microscope. Les principaux types sont les bactéries, les virus et les champignons.|الميكروبات كائنات دقيقة لا تُرى إلا بالمجهر، ومن أنواعها الرئيسية البكتيريا والفيروسات والفطريات.","Some microbes are harmful and cause diseases, such as cholera and the flu. Others are useful: yeast is used to make bread, and some bacteria are used to make yoghurt.|Certains microbes sont nuisibles et causent des maladies, comme le choléra et la grippe. D'autres sont utiles : la levure sert à faire le pain et certaines bactéries à faire le yaourt.|بعض الميكروبات ضار ويسبب أمراضًا مثل الكوليرا والإنفلونزا، وبعضها نافع؛ فالخميرة تُستخدم في صناعة الخبز وبعض البكتيريا في صناعة الزبادي.","Washing hands, cooking food well, storing food in the fridge and vaccination help prevent diseases caused by microbes.|Se laver les mains, bien cuire les aliments, les conserver au réfrigérateur et se faire vacciner aident à prévenir les maladies causées par les microbes.|غسل اليدين وطهي الطعام جيدًا وحفظه في الثلاجة والتطعيم تساعد على الوقاية من الأمراض التي تسببها الميكروبات."],
["The solar system consists of the Sun, the eight planets and their moons, asteroids and comets, all orbiting the Sun. The Sun is a star and our main source of light and heat.|Le système solaire comprend le Soleil, les huit planètes et leurs lunes, des astéroïdes et des comètes, qui tournent tous autour du Soleil. Le Soleil est une étoile, notre principale source de lumière et de chaleur.|يتكون النظام الشمسي من الشمس والكواكب الثمانية وأقمارها والكويكبات والمذنبات التي تدور جميعها حول الشمس. والشمس نجم وهي مصدرنا الرئيسي للضوء والحرارة.","From the Sun outwards: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.|En partant du Soleil : Mercure, Vénus, la Terre, Mars, Jupiter, Saturne, Uranus et Neptune.|بالترتيب من الشمس: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون.","The Earth rotates on its axis once every 24 hours (day and night) and revolves around the Sun once a year (about 365 days).|La Terre tourne sur son axe en 24 heures (jour et nuit) et fait le tour du Soleil en un an (environ 365 jours).|تدور الأرض حول محورها مرة كل 24 ساعة (الليل والنهار) وحول الشمس مرة كل سنة (نحو 365 يومًا)."],
["A lunar eclipse happens when the Earth is between the Sun and the Moon, in a straight line, so the Earth's shadow falls on the Moon.|Une éclipse lunaire se produit quand la Terre se place entre le Soleil et la Lune, en ligne droite : l'ombre de la Terre tombe sur la Lune.|يحدث خسوف القمر عندما تقع الأرض بين الشمس والقمر على استقامة واحدة، فيسقط ظل الأرض على القمر.","It can only happen at full moon. It does not happen every month because the Moon's orbit is slightly tilted, so the three bodies are usually not perfectly aligned.|Elle ne peut avoir lieu qu'à la pleine lune. Elle n'a pas lieu chaque mois car l'orbite de la Lune est légèrement inclinée : les trois astres ne sont généralement pas parfaitement alignés.|لا يحدث الخسوف إلا في طور البدر، ولا يحدث كل شهر لأن مدار القمر مائل قليلًا فلا تكون الأجرام الثلاثة على استقامة واحدة تمامًا في الغالب.","In a total lunar eclipse the Moon often looks reddish. Unlike a solar eclipse, a lunar eclipse is safe to watch with the naked eye.|Lors d'une éclipse lunaire totale, la Lune paraît souvent rougeâtre. Contrairement à l'éclipse solaire, on peut l'observer sans danger à l'œil nu.|في الخسوف الكلي يبدو القمر غالبًا محمرًّا. وعلى عكس كسوف الشمس، يمكن مشاهدة خسوف القمر بالعين المجردة بأمان."]];

function beep(f=520,d=.12,t="sine"){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),v=[.08,.2,.4][VOL];o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}

function mkQ(kind,p,all){const o=sh(all.filter(x=>x.id!==p.id));const exp=`<b>${p.t}</b>: ${p.d}`;

const ao=$("#ao"),fin=(ok)=>{if(ans)return;ans=true;clearInterval(tm);if(ok){sc++;SFX.ok();daily()}else SFX.no();log.push({q:q.q,ok,exp:q.exp});
$("#fb").innerHTML=`<b style="color:var(--${ok?"ok":"no"})">${tr(ok?"correct":"wrong")}</b> — ${q.exp}`;const b=document.createElement("button");b.className="btn";b.textContent=tr("next");b.onclick=()=>{i++;nx()};$("#fb").after(b);hdr()};
if(q.k==="c"){ao.innerHTML=q.o.map((t,j)=>`<button class="opt" data-j="${j}">${t}</button>`).join("");ao.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(ans)return;const j=+b.dataset.j;ao.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add("ok")});if(j!==q.a)b.classList.add("no");fin(j===q.a)})}
else if(q.k==="f"){ao.innerHTML=`<input id="fi" autocomplete="off" dir="auto"><button class="btn" id="ck">${tr("check")}</button>`;$("#ck").onclick=()=>fin(norm($("#fi").value)===norm(q.a))}
else{const defs=sh(q.ps);ao.innerHTML=q.ps.map((p,j)=>`<div class="mrow"><b>${p.t}</b><select data-j="${j}"><option value="">—</option>${defs.map(d=>`<option value="${q.ps.indexOf(d)}">${d.d}</option>`).join("")}</select></div>`).join("")+`<button class="btn" id="ck">${tr("check")}</button>`;$("#ck").onclick=()=>fin([...ao.querySelectorAll("select")].every(s=>s.value!==""&&+s.value===+s.dataset.j))}
if(o.timer){let t=o.timer;tm=setInterval(()=>{t--;const e=$("#tl");if(e){e.textContent=t;if(t<=3)e.style.color="var(--no)"}if(t>0)SFX.tick(t<=3);if(t<=0){if(q.k==="c")ao.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add("ok")});fin(false)}},1000)}};nx()}

const errMsg=e=>{const c=e.code||"";return c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?tr("e_cancel"):c==="auth/unauthorized-domain"?tr("e_dom"):c==="auth/operation-not-allowed"?tr("e_op"):tr("e_other")+" ("+(c||e.message)+")"};
async function cloudLoad(){if(!fb||user.guest)return;try{const d=await withTO(fb.getDoc(fb.doc(fb.db,"users",user.uid)),7000);if(d.exists()){const c=d.data();if((c.t||0)>(S.t||0)){["name","photo","updated"].forEach(k=>delete c[k]);S=Object.assign(fresh(),c);if(!Number.isFinite(Number(c.totalCoinsEarned)))S.totalCoinsEarned=Number(S.coins)||0;localStorage.setItem("sh_"+user.uid,JSON.stringify(S));applyLook();hdr();route()}}else save()}catch(e){cloudWarn(e)}}
function startActiveTracking(){
  if(activeTimer)clearInterval(activeTimer);
  let last=Date.now();
  activeTimer=setInterval(()=>{
    const now=Date.now(),delta=Math.max(0,Math.min(15,(now-last)/1000));last=now;
    if(!user||user.guest||!S||document.visibilityState!=="visible"||!document.hasFocus())return;
    S.activeSeconds=(Number(S.activeSeconds)||0)+delta;
    save();
  },10000);
  document.addEventListener("visibilitychange",()=>{last=Date.now()});
  window.addEventListener("focus",()=>{last=Date.now()});
  window.addEventListener("blur",()=>{last=Date.now()});
}
function enter(u){if(entered)return;entered=true;user=u;S=Object.assign(fresh(),JSON.parse(localStorage.getItem("sh_"+u.uid)||"{}"));if(!Number.isFinite(Number(S.totalCoinsEarned)))S.totalCoinsEarned=Number(S.coins)||0;cloudReady=!!u.guest||!fb;applyLook();
$("#login").classList.add("hidden");$("#app").classList.remove("hidden");buildNav();hdr();$("#avBtn").innerHTML=AVH(22);window.onhashchange=route;
if(!location.hash&&S.last&&S.last!=="#/")location.hash=S.last;else route();cloudLoad().finally(()=>{cloudReady=true;startActiveTracking()})}
async function logout(){try{if(fb&&user&&!user.guest)await withTO(fb.signOut(),4000)}catch(e){}localStorage.removeItem("sh_guest");location.hash="";location.reload()}
$("#avBtn").onclick=()=>{location.hash="#/profile"};$("#loBtn").onclick=logout;
const showLogin=()=>$("#login").classList.remove("hidden");
async function initAuth(){buildLL();const ok=FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId;
$("#guestBtn").onclick=()=>{localStorage.setItem("sh_guest","1");enter({uid:"guest",guest:1})};
if(localStorage.getItem("sh_guest")==="1")return enter({uid:"guest",guest:1});
showLogin();
if(!ok){setLM("loginmsg");$("#gBtn").disabled=true;return}
if(location.protocol==="file:"){setLM("e_file");$("#gBtn").disabled=true;return}
setLM("loginwait");$("#gBtn").disabled=true;
try{const B="https://www.gstatic.com/firebasejs/10.12.2/";const[a,au,fs]=await withTO(Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]),15000);
const app=a.initializeApp(FIREBASE_CONFIG),auth=au.getAuth(app);try{await au.setPersistence(auth,au.browserLocalPersistence)}catch(e){}
fb={db:fs.getFirestore(app),doc:fs.doc,getDoc:fs.getDoc,setDoc:fs.setDoc,collection:fs.collection,query:fs.query,orderBy:fs.orderBy,limit:fs.limit,onSnapshot:fs.onSnapshot,signOut:()=>au.signOut(auth)};
const prov=new au.GoogleAuthProvider();prov.setCustomParameters({prompt:"select_account"});
$("#gBtn").onclick=async()=>{$("#loginErr").textContent="";try{await au.signInWithPopup(auth,prov)}catch(e){const c=e.code||"";if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){try{await au.signInWithRedirect(auth,prov)}catch(e2){$("#loginErr").textContent=errMsg(e2)}}else $("#loginErr").textContent=errMsg(e)}};
$("#gBtn").disabled=false;setLM("loginmsg2");
au.onAuthStateChanged(auth,u=>{if(u)enter({uid:u.uid,name:u.displayName,photo:u.photoURL,email:u.email})})
}catch(e){setLM("loginfail");$("#loginErr").textContent=e.code==="timeout"?tr("e_timeout"):String(e.message||e)}}
let p=0;const iv=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*9));$("#lbar").style.width=p+"%";$("#lpct").textContent=p+"%";if(p>=100){clearInterval(iv);setTimeout(()=>{$("#loader").classList.add("out");setTimeout(()=>$("#loader").remove(),600);initAuth()},300)}},90);
</script></body></html>
